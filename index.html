            const parsedLegacy = JSON.parse(rawLegacy);
            if (Array.isArray(parsedLegacy)) {
              parsedLegacy.forEach((id) => {
                const m = /^fc-(unit7|unit9|unit12)-(\d+)$/.exec(id);
                if (m && Number(m[2]) < FLASHCARD_DATA[m[1]].length) state.cardKnownIds.add(id);
              });
              saveCardProgress();
            }
          }
          }
        }
        let prPayload = readPracticeCookie();
        if (!prPayload) {
          const rawPr = localStorage.getItem(STORAGE_KEY_PRACTICE);
          if (rawPr) {
            try { prPayload = JSON.parse(rawPr); } catch (e) { prPayload = null; }
          }
        }
        if (prPayload && Array.isArray(prPayload.m)) {
          const valid = allPracticeItemIds();
          prPayload.m.forEach((id) => {
            if (valid.has(id)) state.practiceMarkedIds.add(id);
          });
          savePracticeProgress();
        }
        const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
        if (savedTheme && ["paper", "sepia", "dark"].includes(savedTheme)) {
          state.theme = savedTheme;
        }
      } catch (err) {
        console.warn("Storage unavailable:", err);
      }
      applyTheme();
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY_MASTERED, JSON.stringify([...state.masteredIds]));
      } catch (err) {
        console.warn("Storage save skipped:", err);
      }
    }

    function cardIdsToIndexMap(set) {
      const out = {};
      set.forEach((id) => {
        const m = /^fc-(unit7|unit9|unit12)-(\d+)$/.exec(id);
        if (!m) return;
        const idx = Number(m[2]);
        if (idx >= 0 && idx < FLASHCARD_DATA[m[1]].length) {
          (out[m[1]] = out[m[1]] || []).push(idx);
        }
      });
      Object.values(out).forEach((arr) => arr.sort((a, b) => a - b));
      return out;
    }

    function indexMapToCardIds(map) {
      const set = new Set();
      if (!map || typeof map !== "object") return set;
      Object.keys(FLASHCARD_DATA).forEach((key) => {
        const arr = Array.isArray(map[key]) ? map[key] : [];
        arr.forEach((i) => {
          if (Number.isInteger(i) && i >= 0 && i < FLASHCARD_DATA[key].length) {
            set.add(`fc-${key}-${i}`);
          }
        });
      });
      return set;
    }

    function applyCardPayload(payload) {
      if (!payload || typeof payload !== "object") return false;
      if (payload.d && !["en2ja", "ja2en"].includes(payload.d)) return false;
      if (payload.f && !["all", "unknown", "wrong"].includes(payload.f)) return false;
      state.cardKnownIds = indexMapToCardIds(payload.k);
      state.cardWrongIds = indexMapToCardIds(payload.w);
      if (payload.d) state.cardDirection = payload.d;
      if (payload.f) state.cardFilter = payload.f;
      return true;
    }

    function readCardCookie() {
      try {
        const m = document.cookie.match(new RegExp(`(?:^|;\\s*)${COOKIE_KEY_CARD}=([^;]*)`));
        if (!m) return null;
        return JSON.parse(decodeURIComponent(m[1]));
      } catch (err) {
        return null;
      }
    }

    function saveCardProgress() {
      const json = JSON.stringify({
        k: cardIdsToIndexMap(state.cardKnownIds),
        w: cardIdsToIndexMap(state.cardWrongIds),
        d: state.cardDirection,
        f: state.cardFilter
      });
      try {
        document.cookie = `${COOKIE_KEY_CARD}=${encodeURIComponent(json)}; max-age=31536000; path=/; SameSite=Lax`;
      } catch (err) {
        console.warn("Cookie save skipped:", err);
      }
      try {
        localStorage.setItem(STORAGE_KEY_CARD_PROGRESS, json);
      } catch (err) {
        console.warn("Storage save skipped:", err);
      }
    }

    /* =========================================================================
       テーマ・音声・ユーティリティ
    ========================================================================= */
    function setTheme(themeName) {
      state.theme = themeName;
      applyTheme();
      try {
        localStorage.setItem(STORAGE_KEY_THEME, themeName);
      } catch (err) {
        console.warn("Theme save skipped:", err);
      }
    }

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", state.theme);
      ["paper", "sepia", "dark"].forEach((t) => {
        document.querySelectorAll(`[data-theme-btn="${t}"]`).forEach((btn) => {
        if (state.theme === t) {
          btn.style.backgroundColor = "var(--bg-surface)";
          btn.style.color = "var(--text-main)";
          btn.style.fontWeight = "700";
        } else {
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--text-muted)";
          btn.style.fontWeight = "500";
        }
        });
      });
    }

    let toastTimer = null;
    function showToast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.remove("opacity-0");
      el.classList.add("opacity-100");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add("opacity-0");
        el.classList.remove("opacity-100");
      }, 1800);
    }

    function speakText(text) {
      try {
        if (!("speechSynthesis" in window)) {
          showToast("このブラウザは音声読み上げに非対応です");
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = state.speechRate;
        window.speechSynthesis.speak(utter);
      } catch (err) {
        showToast("音声を再生できませんでした");
      }
    }

    function cycleSpeechRate() {
      const rates = [0.75, 0.95, 1.15];
      const nextIdx = (rates.indexOf(state.speechRate) + 1) % rates.length;
      state.speechRate = rates[nextIdx];
      document.querySelectorAll(".js-rate-label").forEach((el) => {
        el.textContent = `速度 ${state.speechRate}x`;
      });
    }

    function toggleMobileSettings() {
      const panel = document.getElementById("mobile-settings");
      const btn = document.getElementById("btn-mobile-settings");
      const isHidden = panel.classList.toggle("hidden");
      panel.classList.toggle("flex", !isHidden);
      btn.setAttribute("aria-expanded", String(!isHidden));
    }

    function stripClozeMarkers(clozeStr) {
      return clozeStr.replace(/\{\{(.*?)\}\}/g, "$1");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeJsSingle(str) {
      return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    /* =========================================================================
       ユニット・モード・レイアウト切替
    ========================================================================= */
    function switchUnit(unitKey) {
      state.currentUnit = unitKey;
      state.focusIndex = 0;
      state.practiceSource = "unit";
      updateHeaderUI();
      renderCurrentView();
      if (state.currentMode === "quiz") resetQuizPoolAndNext();
      if (state.currentMode === "card") { buildCardQueue(); renderCardMode(); }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function switchMode(mode) {
      state.currentMode = mode;
      updateHeaderUI();
      renderCurrentView();
      if (mode === "quiz") resetQuizPoolAndNext();
      if (mode === "card") { buildCardQueue(); renderCardMode(); }
    }

    function setSlashLayout(layout) {
      state.slashLayout = layout;
      renderSlashMode();
    }

    function onFilterUnmasteredChange() {
      state.focusIndex = 0;
      renderSlashMode();
    }

    function updateHeaderUI() {
      const unit = UNITS_DATA[state.currentUnit];

      // ユニットタブ（落ち着いた控えめな選択表示）
      ["unit7", "unit9", "unit12"].forEach((key) => {
        const idMap = { unit7: "btn-unit-7", unit9: "btn-unit-9", unit12: "btn-unit-12" };
        const btn = document.getElementById(idMap[key]);
        if (!btn) return;
        if (state.currentUnit === key) {
          btn.style.backgroundColor = "var(--accent-soft)";
          btn.style.color = "var(--accent)";
          btn.style.fontWeight = "700";
        } else {
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--text-muted)";
          btn.style.fontWeight = "500";
        }
      });

      // モードタブ（下線のみでシンプルに）
      ["slash", "quiz", "worksheet", "card", "practice"].forEach((t) => {
        const el = document.getElementById(`tab-${t}`);
        if (el) {
          if (state.currentMode === t) {
            el.style.borderColor = "var(--accent)";
            el.style.color = "var(--text-main)";
            el.style.fontWeight = "700";
          } else {
            el.style.borderColor = "transparent";
            el.style.color = "var(--text-muted)";
            el.style.fontWeight = "500";
          }
        }
        const mel = document.getElementById(`mtab-${t}`);
        if (mel) {
          if (state.currentMode === t) {
            mel.style.color = "var(--accent)";
            mel.style.fontWeight = "700";
          } else {
            mel.style.color = "var(--text-muted)";
            mel.style.fontWeight = "500";
          }
        }
      });

      if (state.currentMode === "card") {
        document.getElementById("unit-badge").textContent = `${unit.badge}（全${FLASHCARD_DATA[state.currentUnit].length}語）`;
      } else if (state.currentMode === "practice") {
        document.getElementById("unit-badge").textContent = currentPracticeData().label;
      } else {
        document.getElementById("unit-badge").textContent = `${unit.badge}（全${unit.sentences.length}文）`;
      }
      document.getElementById("unit-title-en").textContent = unit.titleEn;
      document.getElementById("unit-title-ja").textContent = unit.titleJa;
      const hideTitles = state.currentMode === "card"
        || (state.currentMode === "practice" && state.practiceSource !== "unit");
      ["unit-title-en", "unit-title-ja"].forEach((tid) => {
        const el = document.getElementById(tid);
        el.classList.toggle("hidden", hideTitles);
        el.classList.toggle("sm:block", hideTitles);
      });

      updateProgressUI();
    }

    function updateProgressUI() {
      const unit = UNITS_DATA[state.currentUnit];
      if (state.currentMode === "card") {
        const cards = FLASHCARD_DATA[state.currentUnit];
        const known = cards.filter((_, i) => state.cardKnownIds.has(`fc-${state.currentUnit}-${i}`)).length;
        const wrong = cards.filter((_, i) => state.cardWrongIds.has(`fc-${state.currentUnit}-${i}`)).length;
        const pct = cards.length === 0 ? 0 : Math.round((known / cards.length) * 100);
        document.getElementById("top-progress-line").style.width = `${pct}%`;
        document.getElementById("progress-text").textContent = `覚えた ${known} / ${cards.length}・苦手 ${wrong}`;
        return;
      }
      if (state.currentMode === "practice") {
        const srcIds = practiceItemIdsOf(currentPracticeData());
        const marked = srcIds.filter((id) => state.practiceMarkedIds.has(id)).length;
        const pct = srcIds.length === 0 ? 0 : Math.round((marked / srcIds.length) * 100);
        document.getElementById("top-progress-line").style.width = `${pct}%`;
        document.getElementById("progress-text").textContent = `苦手 ${marked}`;
        return;
      }
      const total = unit.sentences.length;
      const done = unit.sentences.filter((s) => state.masteredIds.has(s.id)).length;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById("top-progress-line").style.width = `${pct}%`;
      document.getElementById("progress-text").textContent = `習得 ${done} / ${total}`;
    }

    function renderCurrentView() {
      document.getElementById("view-slash").classList.toggle("hidden", state.currentMode !== "slash");
      document.getElementById("view-quiz").classList.toggle("hidden", state.currentMode !== "quiz");
      document.getElementById("view-worksheet").classList.toggle("hidden", state.currentMode !== "worksheet");
      document.getElementById("view-card").classList.toggle("hidden", state.currentMode !== "card");
      document.getElementById("view-practice").classList.toggle("hidden", state.currentMode !== "practice");

      if (state.currentMode === "slash") renderSlashMode();
      if (state.currentMode === "worksheet") renderWorksheetMode();
      if (state.currentMode === "card") renderCardMode();
      if (state.currentMode === "practice") renderPracticeMode();
    }

    /* =========================================================================
       モード1：スラッシュ読解（1文集中 & 一覧）
    ========================================================================= */
    function getFilteredSentences() {
      const unit = UNITS_DATA[state.currentUnit];
      const onlyUnmastered = document.getElementById("filter-unmastered").checked;
      return unit.sentences.filter((s) => !onlyUnmastered || !state.masteredIds.has(s.id));
    }

    function stepFocusSentence(delta) {
      const list = getFilteredSentences();
      if (list.length === 0) return;
      const next = state.focusIndex + delta;
      if (next >= 0 && next < list.length) {
        state.focusIndex = next;
        renderSlashMode();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function jumpToFocusIndex(index) {
      const list = getFilteredSentences();
      if (index >= 0 && index < list.length) {
        state.focusIndex = index;
        renderSlashMode();
      }
    }

    function toggleSlashes() {
      state.showSlashes = !state.showSlashes;
      const btn = document.getElementById("btn-toggle-slashes");
      btn.textContent = state.showSlashes ? "/ 区切り: ON" : "/ 区切り: OFF";
      btn.style.color = state.showSlashes ? "var(--accent)" : "var(--text-muted)";
      renderSlashMode();
    }

    function setAllChunksVisibility(show) {
      const list = getFilteredSentences();
      const targets = state.slashLayout === "focus" && list[state.focusIndex]
        ? [list[state.focusIndex]]
        : list;

      targets.forEach((sent) => {
        sent.chunks.forEach((_, idx) => {
          state.revealedChunks[`${sent.id}-${idx}`] = show;
        });
      });
      renderSlashMode();
    }

    function toggleChunk(sentId, chunkIdx) {
      const key = `${sentId}-${chunkIdx}`;
      state.revealedChunks[key] = !state.revealedChunks[key];

      const jaEl = document.getElementById(`chunk-ja-${key}`);
      const boxEl = document.getElementById(`chunk-box-${key}`);
      if (jaEl && boxEl) {
        const revealed = state.revealedChunks[key];
        jaEl.className = `mt-2 text-xs sm:text-sm font-medium leading-snug ${revealed ? "chunk-visible" : "chunk-hidden"}`;
        boxEl.style.borderColor = revealed ? "var(--accent-border)" : "var(--border-soft)";
        boxEl.style.backgroundColor = revealed ? "var(--accent-soft)" : "var(--bg-surface)";
      }
    }

    function toggleSentenceChunks(sentId, show) {
      const unit = UNITS_DATA[state.currentUnit];
      const sent = unit.sentences.find((s) => s.id === sentId);
      if (!sent) return;
      sent.chunks.forEach((_, idx) => {
        const key = `${sentId}-${idx}`;
        state.revealedChunks[key] = show;
        const jaEl = document.getElementById(`chunk-ja-${key}`);
        const boxEl = document.getElementById(`chunk-box-${key}`);
        if (jaEl && boxEl) {
          jaEl.className = `mt-2 text-xs sm:text-sm font-medium leading-snug ${show ? "chunk-visible" : "chunk-hidden"}`;
          boxEl.style.borderColor = show ? "var(--accent-border)" : "var(--border-soft)";
          boxEl.style.backgroundColor = show ? "var(--accent-soft)" : "var(--bg-surface)";
        }
      });
    }

    // 補助パネル（重要単語 / 和訳メモ / 模範和訳）を1つずつ静かに開閉
    function togglePanel(sentId, panelName) {
      state.openPanels[sentId] = state.openPanels[sentId] === panelName ? null : panelName;
      renderSlashMode();
    }

    function toggleMastered(sentId) {
      if (state.masteredIds.has(sentId)) {
        state.masteredIds.delete(sentId);
      } else {
        state.masteredIds.add(sentId);
      }
      saveProgress();
      updateProgressUI();
      renderSlashMode();
    }

    function saveDraft(sentId, value) {
      state.userDrafts[sentId] = value;
    }

    function flipVocabChip(chipEl, enText, jaText) {
      const isFlipped = chipEl.dataset.flipped === "true";
      const labelEl = chipEl.querySelector(".vocab-text");
      if (isFlipped) {
        chipEl.dataset.flipped = "false";
        labelEl.textContent = enText;
        chipEl.style.borderColor = "var(--border-soft)";
        chipEl.style.backgroundColor = "var(--bg-surface)";
        chipEl.style.color = "var(--text-main)";
      } else {
        chipEl.dataset.flipped = "true";
        labelEl.textContent = jaText;
        chipEl.style.borderColor = "var(--accent-border)";
        chipEl.style.backgroundColor = "var(--accent-soft)";
        chipEl.style.color = "var(--accent)";
      }
    }

    function buildSentenceCardHtml(sent) {
      const isMastered = state.masteredIds.has(sent.id);
      const fullEn = sent.chunks.map((c) => c.en).join(" ");
      const fullJp = stripClozeMarkers(sent.jpCloze);
      const activePanel = state.openPanels[sent.id] || null;
      const draftVal = state.userDrafts[sent.id] || "";

      // 1) オレンジスラッシュ付き英文（読みやすさ最優先の行間・文字サイズ）
      const slashLineHtml = sent.chunks.map((chunk, i) => {
        const isLast = i === sent.chunks.length - 1;
        const slashSpan = state.showSlashes && !isLast
          ? `<span class="text-accent font-semibold mx-1.5 select-none">/</span>`
          : " ";
        return `<span class="cursor-pointer hover:underline decoration-orange-400/70 underline-offset-4" onclick="toggleChunk('${sent.id}', ${i})" title="タップしてこのチャンクの訳を表示">${escapeHtml(chunk.en)}</span>${slashSpan}`;
      }).join("");

      // 2) チャンク分解ブロック
      const chunkCardsHtml = sent.chunks.map((chunk, idx) => {
        const key = `${sent.id}-${idx}`;
        const revealed = !!state.revealedChunks[key];
        return `
          <button
            type="button"
            id="chunk-box-${key}"
            onclick="toggleChunk('${sent.id}', ${idx})"
            class="flex flex-col justify-between p-3 rounded-xl border text-left transition-colors"
            style="border-color: ${revealed ? 'var(--accent-border)' : 'var(--border-soft)'}; background-color: ${revealed ? 'var(--accent-soft)' : 'var(--bg-surface)'};"
          >
            <div class="flex items-start justify-between gap-2 w-full">
              <span class="text-sm sm:text-[15px] font-medium text-main leading-snug">${escapeHtml(chunk.en)}</span>
              <span
                onclick="event.stopPropagation(); speakText('${escapeJsSingle(chunk.en)}')"
                title="この部分を聞く"
                class="p-1 -m-1 text-faint hover:text-accent shrink-0 transition-colors"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07"/>
                </svg>
              </span>
            </div>
            <div id="chunk-ja-${key}" class="mt-2 text-xs sm:text-sm font-medium leading-snug ${revealed ? 'chunk-visible' : 'chunk-hidden'}">
              ${escapeHtml(chunk.ja)}
            </div>
          </button>
        `;
      }).join("");

      // 3) 補助パネル内容（必要なときだけ開くので気が散らない）
      let panelBodyHtml = "";
      if (activePanel === "vocab") {
        const vocabHtml = sent.vocab.map((v) => `
          <button
            type="button"
            data-flipped="false"
            onclick="flipVocabChip(this, '${escapeJsSingle(v.en)}', '${escapeJsSingle(v.ja)}')"
            class="inline-flex items-center gap-2 px-3 py-2 rounded-xl border text-xs sm:text-sm font-medium transition-colors select-none"
            style="border-color: var(--border-soft); background-color: var(--bg-surface); color: var(--text-main);"
          >
            <span class="text-[10px] text-faint font-semibold">${escapeHtml(v.pos)}</span>
            <span class="vocab-text">${escapeHtml(v.en)}</span>
          </button>
        `).join("");
        panelBodyHtml = `
          <div class="mt-4 pt-4 border-t border-soft">
            <p class="text-[11px] text-faint mb-2.5">タップで日本語の意味を確認</p>
            <div class="flex flex-wrap gap-2">${vocabHtml}</div>
          </div>
        `;
      } else if (activePanel === "draft") {
        panelBodyHtml = `
          <div class="mt-4 pt-4 border-t border-soft">
            <textarea
              rows="3"
              oninput="saveDraft('${sent.id}', this.value)"
              placeholder="チャンクをつなげて、自分の言葉で日本語にしてみましょう..."
              class="w-full rounded-xl border border-soft subtle-box px-3.5 py-2.5 text-sm text-main outline-none focus:border-orange-400 transition-colors"
            >${escapeHtml(draftVal)}</textarea>
          </div>
        `;
      } else if (activePanel === "answer") {
        panelBodyHtml = `
          <div class="mt-4 pt-4 border-t border-soft space-y-3">
            <div>
              <span class="text-[11px] font-semibold text-accent">模範和訳</span>
              <p class="mt-1 text-sm sm:text-base font-medium text-main leading-relaxed">${escapeHtml(fullJp)}</p>
            </div>
            <div class="p-3.5 rounded-xl subtle-box border border-soft">
              <span class="text-[11px] font-semibold text-muted">構文・ポイント</span>
              <p class="mt-1 text-xs sm:text-sm text-muted leading-relaxed">${escapeHtml(sent.grammarNote)}</p>
            </div>
          </div>
        `;
      }

      const tabBtnStyle = (name) => activePanel === name
        ? `background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); font-weight: 600;`
        : `background-color: transparent; border-color: var(--border-soft); color: var(--text-muted); font-weight: 500;`;

      return `
        <article class="surface rounded-2xl border p-5 sm:p-7 space-y-6">
          <!-- 文ヘッダー（最小限の操作のみ） -->
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5">
              <span class="text-xs font-bold text-accent px-2 py-0.5 rounded-md" style="background-color: var(--accent-soft);">
                ${escapeHtml(sent.label)}
              </span>
              <button
                type="button"
                onclick="speakText('${escapeJsSingle(fullEn)}')"
                class="inline-flex items-center gap-1.5 text-xs font-medium text-muted hover:text-main transition-colors px-2 py-1 rounded-lg"
                title="英文を読み上げる"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07"/>
                </svg>
                音声
              </button>
              <button
                type="button"
                onclick="toggleSentenceChunks('${sent.id}', true)"
                class="text-xs font-medium text-faint hover:text-main transition-colors px-1.5 py-1"
              >
                全開
              </button>
              <button
                type="button"
                onclick="toggleSentenceChunks('${sent.id}', false)"
                class="text-xs font-medium text-faint hover:text-main transition-colors px-1.5 py-1"
              >
                隠す
              </button>
            </div>

            <button
              type="button"
              onclick="toggleMastered('${sent.id}')"
              class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs font-medium transition-colors"
              style="border-color: ${isMastered ? 'var(--done)' : 'var(--border-soft)'}; background-color: ${isMastered ? 'var(--done-soft)' : 'transparent'}; color: ${isMastered ? 'var(--done)' : 'var(--text-muted)'};"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
              ${isMastered ? "習得済み" : "習得チェック"}
            </button>
          </div>

          <!-- 英文本体（視覚的な主役） -->
          <div class="text-lg sm:text-[21px] font-medium text-main leading-[1.95] tracking-[0.01em]">
            ${slashLineHtml}
          </div>

          <!-- チャンク練習グリッド -->
          <div class="pt-2">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${chunkCardsHtml}
            </div>
          </div>

          <!-- 補助ツール（折りたたみタブでノイズを排除） -->
          <div class="pt-3 border-t border-soft">
            <div class="flex flex-wrap items-center gap-2">
              <button
                type="button"
                onclick="togglePanel('${sent.id}', 'vocab')"
                class="px-3 py-1.5 rounded-lg border text-xs transition-colors"
                style="${tabBtnStyle('vocab')}"
              >
                重要単語 (${sent.vocab.length})
              </button>
              <button
                type="button"
                onclick="togglePanel('${sent.id}', 'draft')"
                class="px-3 py-1.5 rounded-lg border text-xs transition-colors"
                style="${tabBtnStyle('draft')}"
              >
                和訳メモ${draftVal.trim() ? "・記入あり" : ""}
              </button>
              <button
                type="button"
                onclick="togglePanel('${sent.id}', 'answer')"
                class="px-3 py-1.5 rounded-lg border text-xs transition-colors"
                style="${tabBtnStyle('answer')}"
              >
                模範和訳・解説
              </button>
            </div>
            ${panelBodyHtml}
          </div>
        </article>
      `;
    }

    function renderSlashMode() {
      const container = document.getElementById("slash-cards-container");
      const list = getFilteredSentences();

      // レイアウトボタンの見た目更新
      ["focus", "list"].forEach((mode) => {
        const btn = document.getElementById(`layout-${mode}`);
        if (state.slashLayout === mode) {
          btn.style.backgroundColor = "var(--accent-soft)";
          btn.style.color = "var(--accent)";
          btn.style.fontWeight = "700";
        } else {
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--text-muted)";
          btn.style.fontWeight = "500";
        }
      });

      const slashBtn = document.getElementById("btn-toggle-slashes");
      slashBtn.style.color = state.showSlashes ? "var(--accent)" : "var(--text-muted)";

      const navTop = document.getElementById("focus-nav-top");
      const navBottom = document.getElementById("focus-nav-bottom");

      if (list.length === 0) {
        navTop.classList.add("hidden");
        navBottom.classList.add("hidden");
        container.innerHTML = `
          <div class="surface rounded-2xl border p-10 text-center space-y-2">
            <p class="text-base font-bold text-main">このユニットの未習得の文はありません</p>
            <p class="text-xs sm:text-sm text-muted">「未習得のみ」を外すか、演習モードで復習できます。</p>
          </div>
        `;
        return;
      }

      if (state.slashLayout === "focus") {
        if (state.focusIndex >= list.length) state.focusIndex = list.length - 1;
        if (state.focusIndex < 0) state.focusIndex = 0;

        navTop.classList.remove("hidden");
        navBottom.classList.remove("hidden");

        // セレクトボックス更新
        const selectEl = document.getElementById("focus-sentence-select");
        selectEl.innerHTML = list.map((s, idx) =>
          `<option value="${idx}" ${idx === state.focusIndex ? "selected" : ""}>${escapeHtml(s.label)} （${idx + 1} / ${list.length}）</option>`
        ).join("");

        const isFirst = state.focusIndex === 0;
        const isLast = state.focusIndex === list.length - 1;
        document.getElementById("btn-prev-top").disabled = isFirst;
        document.getElementById("btn-prev-bottom").disabled = isFirst;
        document.getElementById("btn-next-top").disabled = isLast;
        document.getElementById("btn-next-bottom").disabled = isLast;

        container.innerHTML = buildSentenceCardHtml(list[state.focusIndex]);
      } else {
        navTop.classList.add("hidden");
        navBottom.classList.add("hidden");
        container.innerHTML = list.map((sent) => buildSentenceCardHtml(sent)).join("");
      }
    }

    /* =========================================================================
       モード2：単語・チャンク演習（静かな4択）
    ========================================================================= */
    function setQuizType(type) {
      state.quizType = type;
      state.quizCorrect = 0;
      state.quizTotal = 0;
      resetQuizPoolAndNext();
    }

    function updateQuizTypeButtons() {
      ["vocab", "chunk"].forEach((t) => {
        const btn = document.getElementById(`quiz-type-${t}`);
        if (state.quizType === t) {
          btn.style.backgroundColor = "var(--bg-surface)";
          btn.style.color = "var(--text-main)";
          btn.style.fontWeight = "700";
        } else {
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--text-muted)";
          btn.style.fontWeight = "500";
        }
      });
      document.getElementById("quiz-score").textContent = `正答 ${state.quizCorrect} / ${state.quizTotal}`;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildQuizPool() {
      const unit = UNITS_DATA[state.currentUnit];
      const items = [];
      unit.sentences.forEach((sent) => {
        const fullEn = sent.chunks.map((c) => c.en).join(" ");
        if (state.quizType === "vocab") {
          sent.vocab.forEach((v) => {
            items.push({
              en: v.en,
              ja: v.ja,
              tag: `${unit.badge} / 文 ${sent.label}（${v.pos}）`,
              context: fullEn,
              fullJp: stripClozeMarkers(sent.jpCloze)
            });
          });
        } else {
          sent.chunks.forEach((c) => {
            items.push({
              en: c.en,
              ja: c.ja,
              tag: `${unit.badge} / 文 ${sent.label}`,
              context: fullEn,
              fullJp: stripClozeMarkers(sent.jpCloze)
            });
          });
        }
      });
      return items;
    }

    function resetQuizPoolAndNext() {
      updateQuizTypeButtons();
      state.quizPool = shuffleArray(buildQuizPool());
      nextQuizQuestion();
    }

    function nextQuizQuestion() {
      const allItems = buildQuizPool();
      if (state.quizPool.length === 0) {
        state.quizPool = shuffleArray(allItems);
      }

      const target = state.quizPool.pop();
      const distractors = shuffleArray(
        allItems.filter((item) => item.ja !== target.ja && item.en !== target.en)
      ).slice(0, 3);

      const options = shuffleArray([target, ...distractors]);
      state.currentQuiz = { target, options };
      state.quizAnswered = false;

      document.getElementById("quiz-source-tag").textContent = target.tag;
      document.getElementById("quiz-question").textContent = target.en;
      document.getElementById("quiz-context").textContent = target.context;
      document.getElementById("quiz-feedback").classList.add("hidden");

      const optionsContainer = document.getElementById("quiz-options");
      optionsContainer.innerHTML = options.map((opt, idx) => `
        <button
          type="button"
          id="quiz-opt-${idx}"
          onclick="answerQuiz(${idx})"
          class="p-4 rounded-xl border border-soft surface hover:border-orange-400/70 text-sm sm:text-base font-medium text-main transition-colors text-left leading-snug"
        >
          <span class="inline-block w-5 text-xs font-semibold text-faint mr-1">${idx + 1}.</span>
          ${escapeHtml(opt.ja)}
        </button>
      `).join("");

      updateQuizTypeButtons();
    }

    function answerQuiz(chosenIdx) {
      if (state.quizAnswered || !state.currentQuiz) return;
      state.quizAnswered = true;
      state.quizTotal += 1;

      const { target, options } = state.currentQuiz;
      const isCorrect = options[chosenIdx].ja === target.ja;
      if (isCorrect) state.quizCorrect += 1;

      options.forEach((opt, idx) => {
        const btn = document.getElementById(`quiz-opt-${idx}`);
        btn.disabled = true;
        if (opt.ja === target.ja) {
          btn.style.borderColor = "var(--done)";
          btn.style.backgroundColor = "var(--done-soft)";
          btn.style.color = "var(--done)";
          btn.style.fontWeight = "700";
        } else if (idx === chosenIdx) {
          btn.style.borderColor = "var(--wrong)";
          btn.style.backgroundColor = "var(--wrong-soft)";
          btn.style.color = "var(--wrong)";
        } else {
          btn.style.opacity = "0.45";
        }
      });

      const fb = document.getElementById("quiz-feedback");
      const fbTitle = document.getElementById("quiz-feedback-title");
      const fbDetail = document.getElementById("quiz-feedback-detail");

      fb.classList.remove("hidden");
      fb.style.borderColor = isCorrect ? "var(--done)" : "var(--wrong)";
      fb.style.backgroundColor = isCorrect ? "var(--done-soft)" : "var(--wrong-soft)";
      fbTitle.style.color = isCorrect ? "var(--done)" : "var(--wrong)";
      fbTitle.textContent = isCorrect ? "正解" : `不正解 — 正答：${target.ja}`;
      fbDetail.textContent = target.fullJp;
      updateQuizTypeButtons();
    }

    function speakCurrentQuiz() {
      if (state.currentQuiz) speakText(state.currentQuiz.target.en);
    }

    /* =========================================================================
       モード3：プリント穴埋めモード
    ========================================================================= */
    function toggleWorksheetBlank(blankKey) {
      state.revealedBlanks[blankKey] = !state.revealedBlanks[blankKey];
      const el = document.getElementById(`blank-${blankKey}`);
      if (el) {
        const open = state.revealedBlanks[blankKey];
        el.textContent = open ? el.dataset.answer : "　　　";
        el.className = `cloze-slot ${open ? "cloze-slot-open" : "cloze-slot-closed"}`;
      }
    }

    function toggleAllWorksheetBlanks(show) {
      const unit = UNITS_DATA[state.currentUnit];
      unit.sentences.forEach((sent) => {
        let count = 0;
        sent.jpCloze.replace(/\{\{(.*?)\}\}/g, () => {
          state.revealedBlanks[`ws-${sent.id}-${count}`] = show;
          count++;
        });
      });
      renderWorksheetMode();
    }

    function renderWorksheetMode() {
      const container = document.getElementById("worksheet-container");
      const unit = UNITS_DATA[state.currentUnit];

      container.innerHTML = unit.sentences.map((sent) => {
        const fullEn = sent.chunks.map((c) => c.en).join(" ");
        const slashEn = sent.chunks
          .map((c) => escapeHtml(c.en))
          .join(`<span class="text-accent font-semibold mx-1.5">/</span>`);

        let blankIdx = 0;
        const clozeHtml = escapeHtml(sent.jpCloze).replace(/\{\{(.*?)\}\}/g, (_, word) => {
          const key = `ws-${sent.id}-${blankIdx++}`;
          const open = !!state.revealedBlanks[key];
          return `<button
            type="button"
            id="blank-${key}"
            data-answer="${word}"
            onclick="toggleWorksheetBlank('${key}')"
            class="cloze-slot ${open ? 'cloze-slot-open' : 'cloze-slot-closed'}"
          >${open ? word : '　　　'}</button>`;
        });

        return `
          <div class="surface rounded-2xl border p-5 sm:p-6 space-y-4">
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-start gap-3">
                <span class="text-xs font-bold text-accent mt-1 shrink-0">${escapeHtml(sent.label)}</span>
                <p class="text-sm sm:text-base font-medium text-main leading-relaxed">${slashEn}</p>
              </div>
              <button
                type="button"
                onclick="speakText('${escapeJsSingle(fullEn)}')"
                class="p-1.5 text-faint hover:text-main transition-colors shrink-0"
                title="英文を読み上げる"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07"/>
                </svg>
              </button>
            </div>

            <div class="pt-3 border-t border-soft text-sm sm:text-[15px] text-main leading-[2.2]">
              ${clozeHtml}
            </div>
          </div>
        `;
      }).join("");
    }

    /* =========================================================================
       モード4：暗記カードモード
    ========================================================================= */
    function buildCardQueue(options = {}) {
      const cards = FLASHCARD_DATA[state.currentUnit];
      let ids = cards.map((_, i) => `fc-${state.currentUnit}-${i}`);
      if (!options.ignoreFilter) {
        if (state.cardFilter === "unknown") {
          ids = ids.filter((id) => !state.cardKnownIds.has(id));
        } else if (state.cardFilter === "wrong") {
          ids = ids.filter((id) => state.cardWrongIds.has(id));
        }
      }
      if (options.shuffle) ids = shuffleArray(ids);
      state.cardQueue = ids;
      state.cardRoundTotal = ids.length;
      state.cardFlipped = false;
    }

    function setCardDirection(dir) {
      state.cardDirection = dir;
      state.cardFlipped = false;
      saveCardProgress();
      renderCardMode();
    }

    function updateCardSubBar() {
      ["en2ja", "ja2en"].forEach((dir) => {
        const btn = document.getElementById(`card-dir-${dir}`);
        if (!btn) return;
        if (state.cardDirection === dir) {
          btn.style.backgroundColor = "var(--accent-soft)";
          btn.style.color = "var(--accent)";
          btn.style.fontWeight = "700";
        } else {
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--text-muted)";
          btn.style.fontWeight = "500";
        }
      });
      const cards = FLASHCARD_DATA[state.currentUnit];
      const counts = { all: cards.length, unknown: 0, wrong: 0 };
      cards.forEach((_, i) => {
        const id = `fc-${state.currentUnit}-${i}`;
        if (!state.cardKnownIds.has(id)) counts.unknown += 1;
        if (state.cardWrongIds.has(id)) counts.wrong += 1;
      });
      const filterLabels = { all: "すべて", unknown: "未習得", wrong: "苦手" };
      ["all", "unknown", "wrong"].forEach((f) => {
        const btn = document.getElementById(`card-filter-${f}`);
        if (!btn) return;
        btn.textContent = `${filterLabels[f]} ${counts[f]}`;
        if (state.cardFilter === f) {
          btn.style.backgroundColor = "var(--accent-soft)";
          btn.style.color = "var(--accent)";
          btn.style.fontWeight = "700";
        } else {
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--text-muted)";
          btn.style.fontWeight = "500";
        }
      });
    }

    function setCardFilter(filter) {
      state.cardFilter = filter;
      saveCardProgress();
      buildCardQueue();
      renderCardMode();
    }

    function shuffleCardQueue() {
      buildCardQueue({ shuffle: true });
      renderCardMode();
    }

    function resetCardKnown() {
      if (!confirm("このユニットの「覚えた」「苦手」記録をリセットしますか？")) return;
      const prefix = `fc-${state.currentUnit}-`;
      [...state.cardKnownIds].forEach((id) => {
        if (id.startsWith(prefix)) state.cardKnownIds.delete(id);
      });
      [...state.cardWrongIds].forEach((id) => {
        if (id.startsWith(prefix)) state.cardWrongIds.delete(id);
      });
      saveCardProgress();
      buildCardQueue();
      renderCardMode();
      updateProgressUI();
    }

    function cardReplayAll() {
      buildCardQueue({ ignoreFilter: true });
      renderCardMode();
    }

    function cardShuffleRestart() {
      buildCardQueue({ ignoreFilter: true, shuffle: true });
      renderCardMode();
    }

    function cardReviewWrong() {
      setCardFilter("wrong");
    }

    function flipCard() {
      if (state.cardQueue.length === 0 || state.cardFlipped) return;
      state.cardFlipped = true;
      renderCardMode();
    }

    function answerCard(known) {
      if (!state.cardFlipped || state.cardQueue.length === 0) return;
      const id = state.cardQueue.shift();
      if (known) {
        state.cardKnownIds.add(id);
        state.cardWrongIds.delete(id);
      } else {
        state.cardKnownIds.delete(id);
        state.cardWrongIds.add(id);
        const pos = Math.min(3, state.cardQueue.length);
        state.cardQueue.splice(pos, 0, id);
      }
      saveCardProgress();
      state.cardFlipped = false;
      renderCardMode();
      updateProgressUI();
    }

    function renderCardMode() {
      const area = document.getElementById("flashcard-area");
      if (!area) return;
      updateCardSubBar();
      const unit = UNITS_DATA[state.currentUnit];
      const cards = FLASHCARD_DATA[state.currentUnit];

      if (state.cardQueue.length === 0) {
        const known = cards.filter((_, i) => state.cardKnownIds.has(`fc-${state.currentUnit}-${i}`)).length;
        const wrong = cards.filter((_, i) => state.cardWrongIds.has(`fc-${state.currentUnit}-${i}`)).length;
        area.innerHTML = `
          <div class="surface rounded-2xl border p-7 sm:p-10 text-center space-y-4">
            <p class="text-base sm:text-lg font-bold text-main">このユニットのカードをすべて確認しました</p>
            <p class="text-xs sm:text-sm text-muted">覚えた ${known} / ${cards.length} 語・苦手 ${wrong} 語</p>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-2.5 pt-2">
              ${wrong > 0 ? `
              <button
                type="button"
                onclick="cardReviewWrong()"
                class="px-5 py-2.5 rounded-xl border text-sm font-semibold transition-colors"
                style="background-color: var(--wrong-soft); border-color: var(--wrong); color: var(--wrong);"
              >
                苦手 ${wrong} 枚を復習
              </button>
              ` : ""}
              <button
                type="button"
                onclick="cardReplayAll()"
                class="px-5 py-2.5 rounded-xl border text-sm font-semibold transition-colors"
                style="background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent);"
              >
                もう一度（全カード）
              </button>
              <button
                type="button"
                onclick="cardShuffleRestart()"
                class="px-5 py-2.5 rounded-xl border text-sm font-semibold transition-colors"
                style="background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent);"
              >
                シャッフルして再開
              </button>
            </div>
          </div>
        `;
        return;
      }

      const id = state.cardQueue[0];
      const idx = Number(id.split("-").pop());
      const [en, ja] = cards[idx];
      const front = state.cardDirection === "en2ja" ? en : ja;
      const back = state.cardDirection === "en2ja" ? ja : en;
      const pos = Math.min(state.cardRoundTotal - state.cardQueue.length + 1, state.cardRoundTotal);
      const isWrong = state.cardWrongIds.has(id);
      const speakerSvg = `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>`;
      const speakerBtn = (extraCls) => `<button
        type="button"
        onclick="event.stopPropagation(); speakText('${escapeJsSingle(en)}')"
        title="英語を読み上げる"
        class="p-2.5 rounded-xl border border-soft subtle-box text-muted hover:text-main transition-colors shrink-0 ${extraCls}"
      >${speakerSvg}</button>`;

      area.innerHTML = `
        <div
          id="flashcard"
          onclick="flipCard()"
          class="surface rounded-2xl border p-5 sm:p-10 cursor-pointer select-none flex flex-col min-h-[34vh] sm:min-h-56"
          role="button"
          aria-label="カードをめくる"
        >
          <div class="flex items-center justify-between gap-3 text-xs font-medium text-muted">
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-accent font-semibold shrink-0">${escapeHtml(unit.badge)}</span>
              ${isWrong ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold whitespace-nowrap" style="color: var(--wrong); background-color: var(--wrong-soft);">前回わからなかった</span>` : ""}
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <span>${pos} / ${state.cardRoundTotal}</span>
              ${speakerBtn("sm:hidden")}
            </div>
          </div>
          <div class="flex-1 flex items-center justify-center gap-3 py-5">
            <h3 class="text-3xl font-bold text-main leading-snug text-center flex-1 break-words">${escapeHtml(front)}</h3>
            ${speakerBtn("hidden sm:block")}
          </div>
          ${state.cardFlipped ? `
          <div class="pt-5 border-t border-soft text-center">
            <p class="text-2xl sm:text-xl font-bold leading-relaxed break-words" style="color: var(--accent);">${escapeHtml(back)}</p>
          </div>
          ` : `
          <p class="pt-5 border-t border-soft text-center text-xs text-faint">タップして答えを表示</p>
          `}
        </div>

        <div class="grid grid-cols-2 gap-3 sm:flex sm:items-center sm:justify-center">
          <button
            type="button"
            id="card-btn-wrong"
            onclick="answerCard(false)"
            ${state.cardFlipped ? "" : "disabled"}
            class="px-6 py-4 sm:py-2.5 rounded-xl border text-base sm:text-sm font-semibold transition-colors ${state.cardFlipped ? "" : "opacity-40"}"
            style="background-color: var(--wrong-soft); border-color: var(--wrong); color: var(--wrong);"
          >
            まだ <span class="hidden sm:inline text-[10px] font-normal opacity-70 ml-1">←</span>
          </button>
          <button
            type="button"
            id="card-btn-known"
            onclick="answerCard(true)"
            ${state.cardFlipped ? "" : "disabled"}
            class="px-6 py-4 sm:py-2.5 rounded-xl border text-base sm:text-sm font-semibold transition-colors ${state.cardFlipped ? "" : "opacity-40"}"
            style="background-color: var(--done-soft); border-color: var(--done); color: var(--done);"
          >
            覚えた <span class="hidden sm:inline text-[10px] font-normal opacity-70 ml-1">→</span>
          </button>
        </div>
        <p class="sm:hidden text-center text-[11px] text-faint">カードをタップでめくる・左右スワイプでも回答できます</p>
      `;
    }

    /* =========================================================================
       モード5：問題（演習プリント集）
    ========================================================================= */
    function practiceItemIdsOf(srcData) {
      const ids = [];
      srcData.sets.forEach((set) => {
        if (set.type === "blanks") {
          set.blanks.forEach((b) => ids.push(`${set.id}-b${b.n}`));
        } else {
          set.items.forEach((_, i) => ids.push(`${set.id}-${i}`));
        }
      });
      return ids;
    }

    function allPracticeItemIds() {
      const ids = new Set();
      Object.values(PRACTICE_DATA).forEach((src) => {
        practiceItemIdsOf(src).forEach((id) => ids.add(id));
      });
      return ids;
    }

    function currentPracticeData() {
      const key = state.practiceSource === "unit" ? state.currentUnit : state.practiceSource;
      return PRACTICE_DATA[key];
    }

    function currentPracticeSet() {
      const src = currentPracticeData();
      let set = src.sets.find((st) => st.id === state.practiceSetId);
      if (!set) {
        set = src.sets[0];
        state.practiceSetId = set.id;
      }
      return set;
    }

    function setPracticeSource(src) {
      state.practiceSource = src;
      state.practiceSetId = null;
      updateHeaderUI();
      renderPracticeMode();
    }

    function selectPracticeSet(id) {
      state.practiceSetId = id;
      renderPracticeMode();
    }

    function onPracticeFilterChange() {
      state.practiceFilterMarked = document.getElementById("practice-filter-marked").checked;
      renderPracticeMode();
    }

    function resetPracticeSet() {
      const set = currentPracticeSet();
      const prefix = `${set.id}-`;
      Object.keys(state.practiceAnswers).forEach((k) => {
        if (k.startsWith(prefix)) delete state.practiceAnswers[k];
      });
      Object.keys(state.practiceRevealed).forEach((k) => {
        if (k.startsWith(prefix)) delete state.practiceRevealed[k];
      });
      Object.keys(state.practiceOrder).forEach((k) => {
        if (k.startsWith(prefix)) delete state.practiceOrder[k];
      });
      renderPracticeMode();
    }

    function readPracticeCookie() {
      try {
        const m = document.cookie.match(new RegExp(`(?:^|;\\s*)${COOKIE_KEY_PRACTICE}=([^;]*)`));
        if (!m) return null;
        return JSON.parse(decodeURIComponent(m[1]));
      } catch (err) {
        return null;
      }
    }

    function savePracticeProgress() {
      const json = JSON.stringify({ m: [...state.practiceMarkedIds] });
      try {
        document.cookie = `${COOKIE_KEY_PRACTICE}=${encodeURIComponent(json)}; max-age=31536000; path=/; SameSite=Lax`;
      } catch (err) {
        console.warn("Cookie save skipped:", err);
      }
      try {
        localStorage.setItem(STORAGE_KEY_PRACTICE, json);
      } catch (err) {
        console.warn("Storage save skipped:", err);
      }
    }

    function togglePracticeMark(id) {
      if (state.practiceMarkedIds.has(id)) {
        state.practiceMarkedIds.delete(id);
      } else {
        state.practiceMarkedIds.add(id);
        if (state.currentMode === "practice") {
          const filterEl = document.getElementById("practice-filter-marked");
          if (filterEl && filterEl.checked) {
            renderPracticeMode();
          }
        }
      }
      savePracticeProgress();
      updateHeaderUI();
    }

    function practiceMarkBtn(id, showLabel) {
      const marked = state.practiceMarkedIds.has(id);
      const label = showLabel
        ? (marked ? "苦手から外す" : "苦手に追加")
        : `${marked ? "★" : "☆"} わからなかった`;
      const style = marked ? "color: var(--wrong);" : "";
      return `<button type="button" onclick="event.stopPropagation(); togglePracticeMark('${id}')" class="text-[11px] text-faint hover:text-main transition-colors shrink-0 py-1" style="${style}">${label}</button>`;
    }

    function renderPracticeMode() {
      const src = currentPracticeData();
      const set = currentPracticeSet();
      const filterEl = document.getElementById("practice-filter-marked");
      if (filterEl) filterEl.checked = state.practiceFilterMarked;

      const chip = (onclick, label, active) => `
        <button
          type="button"
          onclick="${onclick}"
          class="px-3 py-1.5 rounded-lg border font-medium whitespace-nowrap transition-colors"
          style="${active
            ? "background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent);"
            : "background-color: var(--bg-surface); border-color: var(--border-soft); color: var(--text-muted);"}"
        >${escapeHtml(label)}</button>`;

      document.getElementById("practice-sources").innerHTML = [
        chip(`setPracticeSource('unit')`, PRACTICE_DATA[state.currentUnit].label, state.practiceSource === "unit"),
        chip(`setPracticeSource('toeic6')`, PRACTICE_DATA.toeic6.label, state.practiceSource === "toeic6"),
        chip(`setPracticeSource('toeic7')`, PRACTICE_DATA.toeic7.label, state.practiceSource === "toeic7"),
      ].join("");

      document.getElementById("practice-sets").innerHTML = src.sets
        .map((st) => chip(`selectPracticeSet('${st.id}')`, st.title, st.id === set.id))
        .join("");

      document.getElementById("practice-instruction").textContent = set.instruction;

      let body = "";
      if (set.passages) {
        body += set.passages.map((p) => `
          <details class="surface rounded-2xl border p-4 sm:p-5" open>
            <summary class="text-sm font-bold text-main cursor-pointer select-none">${escapeHtml(p.title)}</summary>
            <p class="mt-3 text-sm text-main leading-relaxed whitespace-pre-line">${escapeHtml(p.text)}</p>
          </details>
        `).join("");
      }

      if (set.type === "choice") body += renderPracticeChoice(set);
      if (set.type === "blanks") body += renderPracticeBlanks(set);
      if (set.type === "flip") body += renderPracticeFlip(set);
      if (set.type === "order") body += renderPracticeOrder(set);

      document.getElementById("practice-body").innerHTML = body;
    }

    function practiceFilteredItems(set) {
      return set.items
        .map((item, i) => ({ item, i }))
        .filter(({ i }) => !state.practiceFilterMarked || state.practiceMarkedIds.has(`${set.id}-${i}`));
    }

    function renderPracticeChoice(set) {
      const items = practiceFilteredItems(set);
      const answered = set.items.filter((_, i) => `${set.id}-${i}` in state.practiceAnswers).length;
      const correct = set.items.filter((_, i) => state.practiceAnswers[`${set.id}-${i}`] === set.items[i].answer).length;
      let html = `<p class="text-xs font-medium text-muted">正答 ${correct} / ${answered}（全${set.items.length}問）</p>`;
      if (items.length === 0) {
        return html + `<p class="text-sm text-faint py-4 text-center">苦手に登録された項目はありません</p>`;
      }
      html += items.map(({ item, i }) => {
        const id = `${set.id}-${i}`;
        const chosen = state.practiceAnswers[id];
        const isAnswered = chosen !== undefined;
        const noLabel = item.no !== undefined ? item.no : i + 1;
        const isBlankOnly = /^\(\d+\)$/.test(item.q);
        const compact = item.options.every((o) => o.length <= 3);
        const optionsHtml = item.options.map((opt, oi) => {
          let style = "";
          let cls = "border border-soft surface text-main transition-colors font-medium";
          if (isAnswered) {
            if (oi === item.answer) {
              style = "background-color: var(--done-soft); border-color: var(--done); color: var(--done);";
            } else if (oi === chosen) {
              style = "background-color: var(--wrong-soft); border-color: var(--wrong); color: var(--wrong);";
            } else {
              cls += " opacity-40";
            }
          }
          if (compact) {
            cls += " rounded-lg text-sm flex items-center justify-center";
            style += "min-width: 44px; min-height: 44px; padding: 0 10px;" + style;
          } else {
            cls += " rounded-xl text-sm sm:text-[15px] w-full text-left px-4 py-3 leading-snug";
          }
          return `<button type="button" ${isAnswered ? "disabled" : `onclick="answerPracticeChoice('${set.id}', ${i}, ${oi})"`} class="${cls}" style="${style}">${escapeHtml(opt)}</button>`;
        }).join("");
        const optionsWrap = compact
          ? `<div class="flex flex-wrap gap-2 mt-3">${optionsHtml}</div>`
          : `<div class="space-y-2 mt-3">${optionsHtml}</div>`;

        let fb = "";
        if (isAnswered) {
          const ok = chosen === item.answer;
          fb = `
            <div class="mt-3 p-3 rounded-xl border text-xs sm:text-sm" style="border-color: var(--border-soft); background-color: var(--bg-subtle);">
              <span class="font-bold" style="color: ${ok ? "var(--done)" : "var(--wrong)"};">${ok ? "正解" : "不正解"}</span>
              ${ok ? "" : `<span class="text-muted">正解: ${escapeHtml(item.options[item.answer])}</span>`}
              ${item.exp ? `<p class="text-muted mt-1 leading-relaxed">${escapeHtml(item.exp)}</p>` : ""}
            </div>`;
        }

        return `
          <div class="surface rounded-2xl border p-4 sm:p-5">
            <div class="flex items-start justify-between gap-2">
              <p class="text-sm sm:text-[15px] font-medium text-main leading-relaxed">
                <span class="text-xs font-bold text-accent mr-1.5">${escapeHtml(String(noLabel))}</span>${isBlankOnly ? `<span class="text-muted">空所 ${escapeHtml(item.q)}</span>` : escapeHtml(item.q)}
              </p>
              ${isAnswered ? practiceMarkBtn(id, true) : ""}
            </div>
            ${optionsWrap}
            ${fb}
          </div>`;
      }).join("");
      return html;
    }

    function answerPracticeChoice(setId, itemIdx, optIdx) {
      const set = currentPracticeSet();
      if (set.id !== setId) return;
      const id = `${set.id}-${itemIdx}`;
      if (id in state.practiceAnswers) return;
      state.practiceAnswers[id] = optIdx;
      if (optIdx !== set.items[itemIdx].answer) {
        state.practiceMarkedIds.add(id);
        savePracticeProgress();
      }
      renderPracticeMode();
      updateHeaderUI();
    }

    function renderPracticeBlanks(set) {
      let blankList = set.blanks;
      if (state.practiceFilterMarked) {
        blankList = blankList.filter((b) => state.practiceMarkedIds.has(`${set.id}-b${b.n}`));
      }
      const textHtml = escapeHtml(set.text).replace(/\[\[(\d+)\]\]/g, (_, n) => {
        const b = set.blanks.find((x) => String(x.n) === String(n));
        if (!b) return `(${n})`;
        const key = `${set.id}-b${b.n}`;
        const open = !!state.practiceRevealed[key];
        const shown = open ? `${b.answer}` : `${b.hint}＿＿＿`;
        return `<button type="button" onclick="togglePracticeBlank('${set.id}', ${b.n})" class="cloze-slot ${open ? "cloze-slot-open" : "cloze-slot-closed"}">(${b.n}) ${shown}</button>`;
      });
      const rows = blankList.map((b) => {
        const key = `${set.id}-b${b.n}`;
        const open = !!state.practiceRevealed[key];
        return `
          <div class="flex items-center justify-between gap-3 px-4 py-2.5 rounded-xl border border-soft surface">
            <span class="text-sm text-main font-medium shrink-0">(${b.n}) ${escapeHtml(b.hint)}…</span>
            <div class="flex items-center gap-3">
              <button type="button" onclick="togglePracticeBlank('${set.id}', ${b.n})" class="text-xs text-accent font-medium py-1">${open ? "隠す" : "答えを見る"}</button>
              ${practiceMarkBtn(key, false)}
            </div>
          </div>`;
      }).join("");
      return `
        <div class="surface rounded-2xl border p-5 sm:p-6">
          <p class="text-sm sm:text-base text-main leading-[2.2]">${textHtml}</p>
        </div>
        <div class="space-y-2">${rows}</div>`;
    }

    function togglePracticeBlank(setId, n) {
      const key = `${setId}-b${n}`;
      state.practiceRevealed[key] = !state.practiceRevealed[key];
      renderPracticeMode();
    }

    function renderPracticeFlip(set) {
      const items = practiceFilteredItems(set);
      if (items.length === 0) {
        return `<p class="text-sm text-faint py-4 text-center">苦手に登録された項目はありません</p>`;
      }
      return items.map(({ item, i }) => {
        const id = `${set.id}-${i}`;
        const open = !!state.practiceRevealed[id];
        return `
          <div
            class="surface rounded-2xl border p-5 sm:p-6 cursor-pointer select-none"
            onclick="togglePracticeFlip('${set.id}', ${i})"
            role="button"
          >
            <div class="flex items-start justify-between gap-3">
              <div class="flex-1">
                <p class="text-sm sm:text-[15px] text-main leading-relaxed">${escapeHtml(item.q)}</p>
                <p class="mt-2 text-xs text-faint">${escapeHtml(item.hint)}＿＿＿＿＿＿</p>
                ${open ? `<p class="mt-2 text-xl font-bold text-accent">${escapeHtml(item.answer)}</p>` : ""}
              </div>
              ${practiceMarkBtn(id, false)}
            </div>
          </div>`;
      }).join("");
    }

    function togglePracticeFlip(setId, i) {
      const id = `${setId}-${i}`;
      state.practiceRevealed[id] = !state.practiceRevealed[id];
      renderPracticeMode();
    }

    function practiceOrderState(setId, i, tokens) {
      const id = `${setId}-${i}`;
      if (!state.practiceOrder[id]) {
        state.practiceOrder[id] = {
          bank: shuffleArray(tokens.map((_, ti) => ti)),
          placed: [],
          checked: false,
          correct: false
        };
      }
      return state.practiceOrder[id];
    }

    function renderPracticeOrder(set) {
      const items = practiceFilteredItems(set);
      if (items.length === 0) {
        return `<p class="text-sm text-faint py-4 text-center">苦手に登録された項目はありません</p>`;
      }
      return items.map(({ item, i }) => {
        const id = `${set.id}-${i}`;
        const st = practiceOrderState(set.id, i, item.tokens);
        const placedChips = st.placed.map((ti, pi) => {
          let label = item.tokens[ti];
          if (!item.prefix && pi === 0) label = label.charAt(0).toUpperCase() + label.slice(1);
          return `<button type="button" onclick="practiceOrderRemove('${set.id}', ${i}, ${pi})" class="px-3 rounded-full border text-sm font-medium transition-colors" style="min-height: 40px; background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent);">${escapeHtml(label)}</button>`;
        }).join("");
        const bankChips = st.bank.map((ti) => {
          return `<button type="button" onclick="practiceOrderAdd('${set.id}', ${i}, ${ti})" ${st.checked && st.correct ? "disabled" : ""} class="px-3 rounded-full border border-soft surface text-sm font-medium text-main transition-colors" style="min-height: 40px;">${escapeHtml(item.tokens[ti])}</button>`;
        }).join("");

        const allPlaced = st.bank.length === 0;
        const lineStyle = st.checked
          ? (st.correct ? "border-color: var(--done);" : "border-color: var(--wrong);")
          : "border-color: var(--border-strong);";
        const checkBtn = st.checked && !st.correct
          ? `<button type="button" onclick="practiceOrderRetry('${set.id}', ${i})" class="px-4 py-2 rounded-xl border text-sm font-semibold" style="background-color: var(--wrong-soft); border-color: var(--wrong); color: var(--wrong);">もう一度</button>`
          : `<button type="button" onclick="checkPracticeOrder('${set.id}', ${i})" ${allPlaced && !st.checked ? "" : "disabled"} class="px-4 py-2 rounded-xl border text-sm font-semibold ${allPlaced && !st.checked ? "" : "opacity-40"}" style="background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent);">答え合わせ</button>`;

        let fb = "";
        if (st.checked) {
          const full = practiceOrderSentence(item);
          fb = st.correct
            ? `<p class="mt-3 text-sm font-bold" style="color: var(--done);">正解 — ${escapeHtml(full)}</p>`
            : `<p class="mt-3 text-sm font-bold" style="color: var(--wrong);">正解: ${escapeHtml(full)}</p>`;
        }

        return `
          <div class="surface rounded-2xl border p-4 sm:p-5">
            <div class="flex items-start justify-between gap-2">
              <p class="text-sm text-muted leading-relaxed">${escapeHtml(item.ja)}</p>
              ${practiceMarkBtn(id, false)}
            </div>
            <div class="flex flex-wrap items-end gap-1.5 border-b border-dashed mt-3 pb-2" style="min-height: 48px; ${lineStyle}">
              ${item.prefix ? `<span class="text-sm text-muted">${escapeHtml(item.prefix)}</span>` : ""}
              ${placedChips}
              ${item.suffix ? `<span class="text-sm text-muted">${escapeHtml(item.suffix)}</span>` : ""}
            </div>
            <div class="flex flex-wrap gap-1.5 mt-3">${bankChips}</div>
            <div class="mt-3 flex items-center gap-2">${checkBtn}</div>
            ${fb}
          </div>`;
      }).join("");
    }

    function practiceOrderSentence(item) {
      let sent = (item.prefix ? item.prefix + " " : "") + item.answer.join(" ") + (item.suffix ? " " + item.suffix : "");
      if (!item.prefix) sent = sent.charAt(0).toUpperCase() + sent.slice(1);
      return sent.replace(/\s+\./g, ".").trim();
    }

    function practiceOrderAdd(setId, i, ti) {
      const set = currentPracticeSet();
      const st = practiceOrderState(setId, i, set.items[i].tokens);
      if (st.checked && st.correct) return;
      if (st.checked) st.checked = false;
      st.bank = st.bank.filter((x) => x !== ti);
      st.placed.push(ti);
      renderPracticeMode();
    }

    function practiceOrderRemove(setId, i, pi) {
      const set = currentPracticeSet();
      const st = practiceOrderState(setId, i, set.items[i].tokens);
      if (st.checked && st.correct) return;
      if (st.checked) st.checked = false;
      const ti = st.placed.splice(pi, 1)[0];
      st.bank.push(ti);
      renderPracticeMode();
    }

    function checkPracticeOrder(setId, i) {
      const set = currentPracticeSet();
      const item = set.items[i];
      const st = practiceOrderState(setId, i, item.tokens);
      if (st.bank.length !== 0 || st.checked) return;
      st.checked = true;
      st.correct = st.placed.map((ti) => item.tokens[ti]).join("\u0000") === item.answer.join("\u0000");
      if (!st.correct) {
        state.practiceMarkedIds.add(`${setId}-${i}`);
        savePracticeProgress();
      }
      renderPracticeMode();
      updateHeaderUI();
    }

    function practiceOrderRetry(setId, i) {
      const set = currentPracticeSet();
      const item = set.items[i];
      const st = practiceOrderState(setId, i, item.tokens);
      st.bank = shuffleArray(item.tokens.map((_, ti) => ti));
      st.placed = [];
      st.checked = false;
      st.correct = false;
      renderPracticeMode();
    }

    /* =========================================================================
       キーボード操作＆タッチスワイプ（集中モードでの快適な移動）
    ========================================================================= */
    function initNavigationShortcuts() {
      document.addEventListener("keydown", (e) => {
        const tag = document.activeElement?.tagName;
        if (tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT") return;

        if (state.currentMode === "slash" && state.slashLayout === "focus") {
          if (e.key === "ArrowLeft") stepFocusSentence(-1);
          if (e.key === "ArrowRight") stepFocusSentence(1);
        } else if (state.currentMode === "quiz") {
          if (["1", "2", "3", "4"].includes(e.key) && !state.quizAnswered) {
            answerQuiz(Number(e.key) - 1);
          } else if (e.key === "Enter" && state.quizAnswered) {
            nextQuizQuestion();
          }
        } else if (state.currentMode === "card") {
          if (!state.cardFlipped) {
            if (e.key === " " || e.key === "Enter") {
              e.preventDefault();
              flipCard();
            }
          } else {
            if (e.key === "ArrowLeft" || e.key === "1") answerCard(false);
            if (e.key === "ArrowRight" || e.key === "2") answerCard(true);
            if (e.key === " ") e.preventDefault();
          }
        }
      });

      // スワイプ移動（タッチデバイス対応）
      const cardArea = document.getElementById("slash-cards-container");
      let startX = 0;
      let startY = 0;
      cardArea.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      cardArea.addEventListener("touchend", (e) => {
        if (state.currentMode !== "slash" || state.slashLayout !== "focus") return;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          stepFocusSentence(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      // カードのスワイプ判定（めくった後のみ有効）
      const flashArea = document.getElementById("flashcard-area");
      let cardStartX = 0;
      let cardStartY = 0;
      flashArea.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) return;
        cardStartX = e.touches[0].clientX;
        cardStartY = e.touches[0].clientY;
      }, { passive: true });

      flashArea.addEventListener("touchend", (e) => {
        if (state.currentMode !== "card" || !state.cardFlipped) return;
        const dx = e.changedTouches[0].clientX - cardStartX;
        const dy = e.changedTouches[0].clientY - cardStartY;
        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          answerCard(dx < 0 ? false : true);
        }
      }, { passive: true });
    }

    /* =========================================================================
       アプリ起動
    ========================================================================= */
    window.addEventListener("DOMContentLoaded", () => {
      loadSavedSettings();
      initNavigationShortcuts();
      updateHeaderUI();
      renderCurrentView();
    });
  </script>
</body>
</html>
