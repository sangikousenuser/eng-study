<!DOCTYPE html>
<html lang="ja" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>英文和訳スラッシュ練習帳 | Unit 7・9・12</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    /* =========================================================
       集中学習向けカラーテーマ（Paper / Sepia / Dark）
       ※視線の邪魔をしない低彩度な紙面と、区切り線だけの落ち着いたオレンジ
    ========================================================== */
    :root,
    [data-theme="paper"] {
      --bg-page: #F7F6F3;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F2F0EB;
      --border-soft: #E5E2DA;
      --border-strong: #D4CFC5;
      --text-main: #1F1E1C;
      --text-muted: #6B6862;
      --text-faint: #9B968D;
      --accent: #C85D1A;
      --accent-soft: #FDF3EC;
      --accent-border: #EAC4A8;
      --done: #2E7D5B;
      --done-soft: #EEF7F2;
      --wrong: #B54343;
      --wrong-soft: #FBF1F1;
    }

    [data-theme="sepia"] {
      --bg-page: #F1EBD9;
      --bg-surface: #FAF6EC;
      --bg-subtle: #EAE2CE;
      --border-soft: #DFD5BE;
      --border-strong: #CBBFA3;
      --text-main: #2E2720;
      --text-muted: #6C6051;
      --text-faint: #9B8D7A;
      --accent: #B85214;
      --accent-soft: #F5E6D6;
      --accent-border: #DFB591;
      --done: #2C6F51;
      --done-soft: #E6F0E8;
      --wrong: #A63C3C;
      --wrong-soft: #F5E4E1;
    }

    [data-theme="dark"] {
      --bg-page: #141517;
      --bg-surface: #1C1E21;
      --bg-subtle: #25282C;
      --border-soft: #2E3238;
      --border-strong: #40464F;
      --text-main: #E7E6E2;
      --text-muted: #9A9EA6;
      --text-faint: #686D76;
      --accent: #E28246;
      --accent-soft: #2B2019;
      --accent-border: #633D25;
      --done: #58B48A;
      --done-soft: #192922;
      --wrong: #E07070;
      --wrong-soft: #2B1D1E;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .surface {
      background-color: var(--bg-surface);
      border-color: var(--border-soft);
    }

    .subtle-box {
      background-color: var(--bg-subtle);
      border-color: var(--border-soft);
    }

    .text-main { color: var(--text-main); }
    .text-muted { color: var(--text-muted); }
    .text-faint { color: var(--text-faint); }
    .text-accent { color: var(--accent); }
    .border-soft { border-color: var(--border-soft); }

    /* チャンク訳の静かな開閉 */
    .chunk-hidden {
      color: transparent;
      background-color: var(--bg-subtle);
      border-radius: 0.375rem;
      user-select: none;
      transition: all 0.18s ease;
    }
    .chunk-visible {
      color: var(--accent);
      background-color: transparent;
      transition: all 0.18s ease;
    }

    /* プリント穴埋めスロット */
    .cloze-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 4.5rem;
      padding: 0.1rem 0.55rem;
      margin: 0 0.15rem;
      border-radius: 0.375rem;
      border-bottom: 2px solid var(--accent);
      transition: all 0.15s ease;
      cursor: pointer;
      vertical-align: baseline;
    }
    .cloze-slot-closed {
      background-color: var(--accent-soft);
      color: var(--accent);
      font-weight: 500;
    }
    .cloze-slot-open {
      background-color: transparent;
      color: var(--accent);
      font-weight: 700;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* タップ応答を速くする（ダブルタップズーム遅延の抑制） */
    button, [role="button"] { touch-action: manipulation; }
  </style>
</head>
<body class="min-h-screen font-sans antialiased selection:bg-orange-200/60">

  <!-- 極細の進捗ライン（視界を邪魔しない2px） -->
  <div class="fixed top-0 left-0 right-0 h-0.5 z-40" style="background-color: var(--border-soft);">
    <div id="top-progress-line" class="h-full transition-all duration-300" style="width: 0%; background-color: var(--accent);"></div>
  </div>

  <!-- =========================================================
       静かなトップバー（固定しないことで読書空間を広く確保）
  ========================================================== -->
  <header class="border-b border-soft" style="background-color: var(--bg-surface);">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 pt-4 pb-3 space-y-3">

      <!-- 1段目：タイトル・テーマ・音声速度 -->
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="text-lg font-bold text-accent select-none">/</span>
          <h1 class="text-sm sm:text-base font-bold tracking-tight text-main whitespace-nowrap">
            英文和訳スラッシュ練習帳
          </h1>
        </div>

        <div class="flex items-center gap-2">
          <div class="hidden sm:flex items-center gap-2">
            <!-- 音声速度（控えめなトグル） -->
            <button
              type="button"
              onclick="cycleSpeechRate()"
              title="読み上げ速度を切り替え"
              class="js-rate-label px-2.5 py-1 rounded-lg border border-soft text-xs font-medium text-muted hover:text-main transition-colors"
            >
              速度 0.95x
            </button>

            <!-- 紙面テーマ切替（Paper / Sepia / Dark） -->
            <div class="flex items-center rounded-lg border border-soft p-0.5" style="background-color: var(--bg-subtle);">
              <button type="button" data-theme-btn="paper" onclick="setTheme('paper')" class="px-2 py-1 rounded-md text-[11px] font-medium transition-colors" title="白紙">白</button>
              <button type="button" data-theme-btn="sepia" onclick="setTheme('sepia')" class="px-2 py-1 rounded-md text-[11px] font-medium transition-colors" title="生成り（目に優しい）">紙</button>
              <button type="button" data-theme-btn="dark" onclick="setTheme('dark')" class="px-2 py-1 rounded-md text-[11px] font-medium transition-colors" title="ダーク">暗</button>
            </div>
          </div>

          <!-- モバイル用 表示設定ボタン -->
          <button
            type="button"
            id="btn-mobile-settings"
            onclick="toggleMobileSettings()"
            aria-label="表示設定"
            aria-expanded="false"
            class="sm:hidden w-9 h-9 rounded-lg border border-soft text-muted hover:text-main transition-colors flex items-center justify-center"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281zM15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- モバイル用 表示設定パネル -->
      <div id="mobile-settings" class="hidden sm:hidden subtle-box rounded-xl border px-3 py-2.5 items-center justify-between gap-3">
        <div class="flex items-center gap-2 text-xs text-muted">
          <span>読み上げ速度</span>
          <button type="button" onclick="cycleSpeechRate()" class="js-rate-label px-2.5 py-2 rounded-lg border border-soft surface text-xs font-medium text-muted" style="min-height: 36px;">速度 0.95x</button>
        </div>
        <div class="flex items-center gap-2 text-xs text-muted">
          <span>テーマ</span>
          <div class="flex items-center rounded-lg border border-soft p-0.5" style="background-color: var(--bg-surface);">
            <button type="button" data-theme-btn="paper" onclick="setTheme('paper')" class="px-3 py-1.5 rounded-md text-[11px] font-medium transition-colors" title="白紙" style="min-height: 36px;">白</button>
            <button type="button" data-theme-btn="sepia" onclick="setTheme('sepia')" class="px-3 py-1.5 rounded-md text-[11px] font-medium transition-colors" title="生成り（目に優しい）" style="min-height: 36px;">紙</button>
            <button type="button" data-theme-btn="dark" onclick="setTheme('dark')" class="px-3 py-1.5 rounded-md text-[11px] font-medium transition-colors" title="ダーク" style="min-height: 36px;">暗</button>
          </div>
        </div>
      </div>

      <!-- 2段目：ユニット切替 & 学習モード切替 -->
      <div class="flex flex-col gap-2.5">
        <!-- ユニット選択 -->
        <nav class="grid grid-cols-3 gap-1 sm:flex sm:items-center" aria-label="ユニット選択">
          <button type="button" id="btn-unit-7" onclick="switchUnit('unit7')" class="px-3 py-2 sm:py-1.5 text-center rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition-colors">
            Unit 7 クジラ
          </button>
          <button type="button" id="btn-unit-9" onclick="switchUnit('unit9')" class="px-3 py-2 sm:py-1.5 text-center rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition-colors">
            Unit 9 自動運転
          </button>
          <button type="button" id="btn-unit-12" onclick="switchUnit('unit12')" class="px-3 py-2 sm:py-1.5 text-center rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition-colors">
            Unit 12 日米AI
          </button>
        </nav>

        <!-- モード選択 -->
        <nav class="hidden sm:flex items-center gap-5" aria-label="学習モード">
          <button type="button" id="tab-slash" onclick="switchMode('slash')" class="pb-1 text-xs sm:text-sm font-medium whitespace-nowrap border-b-2 transition-colors">
            スラッシュ読解
          </button>
          <button type="button" id="tab-quiz" onclick="switchMode('quiz')" class="pb-1 text-xs sm:text-sm font-medium whitespace-nowrap border-b-2 transition-colors">
            単語・チャンク演習
          </button>
          <button type="button" id="tab-worksheet" onclick="switchMode('worksheet')" class="pb-1 text-xs sm:text-sm font-medium whitespace-nowrap border-b-2 transition-colors">
            プリント穴埋め
          </button>
          <button type="button" id="tab-card" onclick="switchMode('card')" class="pb-1 text-xs sm:text-sm font-medium whitespace-nowrap border-b-2 transition-colors">
            暗記カード
          </button>
          <button type="button" id="tab-practice" onclick="switchMode('practice')" class="pb-1 text-xs sm:text-sm font-medium whitespace-nowrap border-b-2 transition-colors">
            問題
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- =========================================================
       メイン学習エリア（余白を広く取り、英文に集中できる構成）
  ========================================================== -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-8 pb-28 sm:pb-20">

    <!-- ユニット見出し＆習得状況 -->
    <div class="mb-4 sm:mb-6 flex flex-col sm:flex-row sm:items-end justify-between gap-2 pb-3 sm:pb-4 border-b border-soft">
      <div>
        <div class="flex items-center gap-2 text-xs font-medium text-muted mb-1">
          <span id="unit-badge" class="text-accent font-semibold">Unit 9</span>
          <span>/</span>
          <span id="progress-text">習得 0 / 0</span>
        </div>
        <h2 id="unit-title-en" class="text-base sm:text-lg font-bold text-main leading-snug"></h2>
        <p id="unit-title-ja" class="text-xs sm:text-sm text-muted mt-0.5"></p>
      </div>
    </div>

    <!-- =========================================================
         モード1：スラッシュ読解（1文集中 / 一覧 切替対応）
    ========================================================== -->
    <section id="view-slash" class="space-y-5">
      <!-- 静かなコントロールバー -->
      <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
        <div class="flex items-center gap-1.5">
          <!-- 1文集中 / 一覧 切替 -->
          <div class="inline-flex rounded-lg border border-soft p-0.5" style="background-color: var(--bg-surface);">
            <button type="button" id="layout-focus" onclick="setSlashLayout('focus')" class="px-3 py-1.5 rounded-md font-medium transition-colors">
              1文集中
            </button>
            <button type="button" id="layout-list" onclick="setSlashLayout('list')" class="px-3 py-1.5 rounded-md font-medium transition-colors">
              一覧
            </button>
          </div>

          <button
            type="button"
            id="btn-toggle-slashes"
            onclick="toggleSlashes()"
            class="px-3 py-1.5 rounded-lg border border-soft font-medium transition-colors"
            style="background-color: var(--bg-surface);"
          >
            / 区切り: ON
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button
            type="button"
            onclick="setAllChunksVisibility(false)"
            class="px-2.5 py-1.5 rounded-lg text-muted hover:text-main transition-colors font-medium"
          >
            訳を隠す
          </button>
          <button
            type="button"
            onclick="setAllChunksVisibility(true)"
            class="px-2.5 py-1.5 rounded-lg text-muted hover:text-main transition-colors font-medium"
          >
            訳を表示
          </button>
          <label class="inline-flex items-center gap-1.5 text-muted cursor-pointer select-none pl-1">
            <input id="filter-unmastered" type="checkbox" onchange="onFilterUnmasteredChange()" class="w-3.5 h-3.5 rounded accent-orange-600" />
            未習得のみ
          </label>
        </div>
      </div>

      <!-- 1文集中モード用ナビゲーション（上部インジケーター） -->
      <div id="focus-nav-top" class="hidden flex items-center justify-between gap-3 py-1">
        <button
          type="button"
          onclick="stepFocusSentence(-1)"
          id="btn-prev-top"
          class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg border border-soft surface text-xs sm:text-sm font-medium text-muted hover:text-main disabled:opacity-35 transition-colors"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          前の文
        </button>

        <div class="flex items-center gap-2">
          <select
            id="focus-sentence-select"
            onchange="jumpToFocusIndex(Number(this.value))"
            aria-label="文を選択"
            class="rounded-lg border border-soft surface px-3 py-1.5 text-xs sm:text-sm font-medium text-main outline-none"
          ></select>
        </div>

        <button
          type="button"
          onclick="stepFocusSentence(1)"
          id="btn-next-top"
          class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg border border-soft surface text-xs sm:text-sm font-medium text-muted hover:text-main disabled:opacity-35 transition-colors"
        >
          次の文
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <!-- 文カード表示領域（スワイプ対応） -->
      <div id="slash-cards-container" class="space-y-6"></div>

      <!-- 1文集中モード用フッターガイド -->
      <div id="focus-nav-bottom" class="hidden pt-2 flex items-center justify-between gap-3">
        <button
          type="button"
          onclick="stepFocusSentence(-1)"
          id="btn-prev-bottom"
          class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-5 py-3 rounded-xl border border-soft surface text-sm font-medium text-main hover:border-orange-400/60 disabled:opacity-35 transition-colors"
        >
          ← 前の文
        </button>
        <span class="hidden sm:inline text-xs text-faint">
          ← → キーまたはスワイプで移動
        </span>
        <button
          type="button"
          onclick="stepFocusSentence(1)"
          id="btn-next-bottom"
          class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-5 py-3 rounded-xl border text-sm font-medium transition-colors disabled:opacity-35"
          style="background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent);"
        >
          次の文 →
        </button>
      </div>
    </section>

    <!-- =========================================================
         モード2：単語・チャンク演習（静かな4択）
    ========================================================== -->
    <section id="view-quiz" class="hidden space-y-5">
      <div class="surface rounded-2xl border p-5 sm:p-8">
        <!-- モード内サブバー -->
        <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-soft">
          <div class="inline-flex rounded-lg border border-soft p-0.5" style="background-color: var(--bg-subtle);">
            <button type="button" id="quiz-type-vocab" onclick="setQuizType('vocab')" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors">
              重要単語
            </button>
            <button type="button" id="quiz-type-chunk" onclick="setQuizType('chunk')" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors">
              チャンク訳
            </button>
          </div>
          <span id="quiz-score" class="text-xs sm:text-sm font-medium text-muted">正答 0 / 0</span>
        </div>

        <!-- 出題エリア -->
        <div class="py-7 sm:py-8">
          <div class="text-xs font-medium text-muted mb-3" id="quiz-source-tag">Unit 9</div>

          <div class="flex items-start justify-between gap-3 mb-3">
            <h3 id="quiz-question" class="text-xl sm:text-2xl font-bold text-main leading-snug"></h3>
            <button
              type="button"
              onclick="speakCurrentQuiz()"
              title="発音を聞く"
              class="p-2.5 rounded-xl border border-soft subtle-box text-muted hover:text-main transition-colors shrink-0"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/>
              </svg>
            </button>
          </div>

          <p id="quiz-context" class="text-xs sm:text-sm text-muted leading-relaxed mb-7"></p>

          <!-- 4択ボタン -->
          <div id="quiz-options" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>

          <!-- 静かな正誤フィードバック -->
          <div id="quiz-feedback" class="hidden mt-6 p-4 rounded-xl border">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="space-y-1">
                <p id="quiz-feedback-title" class="text-sm font-bold"></p>
                <p id="quiz-feedback-detail" class="text-xs sm:text-sm text-muted leading-relaxed"></p>
              </div>
              <button
                type="button"
                onclick="nextQuizQuestion()"
                class="px-5 py-2.5 rounded-xl border text-sm font-semibold shrink-0 transition-colors"
                style="background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent);"
              >
                次へ →
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- =========================================================
         モード3：プリント穴埋めモード
    ========================================================== -->
    <section id="view-worksheet" class="hidden space-y-5">
      <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
        <span class="text-muted">カッコ部分をタップすると答えが表示されます</span>
        <div class="flex items-center gap-2">
          <button
            type="button"
            onclick="toggleAllWorksheetBlanks(false)"
            class="px-3 py-1.5 rounded-lg border border-soft surface text-muted hover:text-main font-medium transition-colors"
          >
            すべて隠す
          </button>
          <button
            type="button"
            onclick="toggleAllWorksheetBlanks(true)"
            class="px-3 py-1.5 rounded-lg border border-soft surface text-accent font-medium transition-colors"
          >
            すべて表示
          </button>
        </div>
      </div>

      <div id="worksheet-container" class="space-y-4"></div>
    </section>

    <!-- =========================================================
         モード4：暗記カードモード
    ========================================================== -->
    <section id="view-card" class="hidden space-y-5">
