<!DOCTYPE html>
<html lang="ja" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英文和訳スラッシュ練習帳 | Unit 7・9・12</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    /* =========================================================
       集中学習向けカラーテーマ（Paper / Sepia / Dark）
       ※視線の邪魔をしない低彩度な紙面と、区切り線だけの落ち着いたオレンジ
    ========================================================== */
    :root,
    [data-theme="paper"] {
      --bg-page: #F7F6F3;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F2F0EB;
      --border-soft: #E5E2DA;
      --border-strong: #D4CFC5;
      --text-main: #1F1E1C;
      --text-muted: #6B6862;
      --text-faint: #9B968D;
      --accent: #C85D1A;
      --accent-soft: #FDF3EC;
      --accent-border: #EAC4A8;
      --done: #2E7D5B;
      --done-soft: #EEF7F2;
      --wrong: #B54343;
      --wrong-soft: #FBF1F1;
    }

    [data-theme="sepia"] {
      --bg-page: #F1EBD9;
      --bg-surface: #FAF6EC;
      --bg-subtle: #EAE2CE;
      --border-soft: #DFD5BE;
      --border-strong: #CBBFA3;
      --text-main: #2E2720;
      --text-muted: #6C6051;
      --text-faint: #9B8D7A;
      --accent: #B85214;
      --accent-soft: #F5E6D6;
      --accent-border: #DFB591;
      --done: #2C6F51;
      --done-soft: #E6F0E8;
      --wrong: #A63C3C;
      --wrong-soft: #F5E4E1;
    }

    [data-theme="dark"] {
      --bg-page: #141517;
      --bg-surface: #1C1E21;
      --bg-subtle: #25282C;
      --border-soft: #2E3238;
      --border-strong: #40464F;
      --text-main: #E7E6E2;
      --text-muted: #9A9EA6;
      --text-faint: #686D76;
      --accent: #E28246;
      --accent-soft: #2B2019;
      --accent-border: #633D25;
      --done: #58B48A;
      --done-soft: #192922;
      --wrong: #E07070;
      --wrong-soft: #2B1D1E;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .surface {
      background-color: var(--bg-surface);
      border-color: var(--border-soft);
    }

    .subtle-box {
      background-color: var(--bg-subtle);
      border-color: var(--border-soft);
    }

    .text-main { color: var(--text-main); }
    .text-muted { color: var(--text-muted); }
    .text-faint { color: var(--text-faint); }
    .text-accent { color: var(--accent); }
    .border-soft { border-color: var(--border-soft); }

    /* チャンク訳の静かな開閉 */
    .chunk-hidden {
      color: transparent;
      background-color: var(--bg-subtle);
      border-radius: 0.375rem;
      user-select: none;
      transition: all 0.18s ease;
    }
    .chunk-visible {
      color: var(--accent);
      background-color: transparent;
      transition: all 0.18s ease;
    }

    /* プリント穴埋めスロット */
    .cloze-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 4.5rem;
      padding: 0.1rem 0.55rem;
      margin: 0 0.15rem;
      border-radius: 0.375rem;
      border-bottom: 2px solid var(--accent);
      transition: all 0.15s ease;
      cursor: pointer;
      vertical-align: baseline;
    }
    .cloze-slot-closed {
      background-color: var(--accent-soft);
      color: var(--accent);
      font-weight: 500;
    }
    .cloze-slot-open {
      background-color: transparent;
      color: var(--accent);
      font-weight: 700;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen font-sans antialiased selection:bg-orange-200/60">

  <!-- 極細の進捗ライン（視界を邪魔しない2px） -->
  <div class="fixed top-0 left-0 right-0 h-0.5 z-40" style="background-color: var(--border-soft);">
    <div id="top-progress-line" class="h-full transition-all duration-300" style="width: 0%; background-color: var(--accent);"></div>
  </div>

  <!-- =========================================================
       静かなトップバー（固定しないことで読書空間を広く確保）
  ========================================================== -->
  <header class="border-b border-soft" style="background-color: var(--bg-surface);">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 pt-4 pb-3 space-y-3">

      <!-- 1段目：タイトル・テーマ・音声速度 -->
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="text-lg font-bold text-accent select-none">/</span>
          <h1 class="text-sm sm:text-base font-bold tracking-tight text-main">
            英文和訳スラッシュ練習帳
          </h1>
        </div>

        <div class="flex items-center gap-2">
          <!-- 音声速度（控えめなトグル） -->
          <button
            type="button"
            id="btn-rate-cycle"
            onclick="cycleSpeechRate()"
            title="読み上げ速度を切り替え"
            class="px-2.5 py-1 rounded-lg border border-soft text-xs font-medium text-muted hover:text-main transition-colors"
          >
            速度 0.95x
          </button>

          <!-- 紙面テーマ切替（Paper / Sepia / Dark） -->
          <div class="flex items-center rounded-lg border border-soft p-0.5" style="background-color: var(--bg-subtle);">
            <button type="button" id="theme-paper" onclick="setTheme('paper')" class="px-2 py-1 rounded-md text-[11px] font-medium transition-colors" title="白紙">白</button>
            <button type="button" id="theme-sepia" onclick="setTheme('sepia')" class="px-2 py-1 rounded-md text-[11px] font-medium transition-colors" title="生成り（目に優しい）">紙</button>
            <button type="button" id="theme-dark" onclick="setTheme('dark')" class="px-2 py-1 rounded-md text-[11px] font-medium transition-colors" title="ダーク">暗</button>
          </div>
        </div>
      </div>

      <!-- 2段目：ユニット切替 & 学習モード切替 -->
      <div class="flex flex-col gap-2.5">
        <!-- ユニット選択 -->
        <nav class="flex items-center gap-1 overflow-x-auto no-scrollbar" aria-label="ユニット選択">
          <button type="button" id="btn-unit-7" onclick="switchUnit('unit7')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition-colors">
            Unit 7 クジラ
          </button>
          <button type="button" id="btn-unit-9" onclick="switchUnit('unit9')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition-colors">
            Unit 9 自動運転
          </button>
          <button type="button" id="btn-unit-12" onclick="switchUnit('unit12')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition-colors">
            Unit 12 日米AI
          </button>
        </nav>

        <!-- モード選択 -->
        <nav class="flex items-center gap-1.5 sm:gap-5 border-t border-soft pt-2 overflow-x-auto no-scrollbar" aria-label="学習モード">
          <button type="button" id="tab-slash" onclick="switchMode('slash')" class="pb-1 text-xs sm:text-sm font-medium whitespace-nowrap border-b-2 transition-colors">
            スラッシュ読解
          </button>
          <button type="button" id="tab-quiz" onclick="switchMode('quiz')" class="pb-1 text-xs sm:text-sm font-medium whitespace-nowrap border-b-2 transition-colors">
            単語・チャンク演習
          </button>
          <button type="button" id="tab-worksheet" onclick="switchMode('worksheet')" class="pb-1 text-xs sm:text-sm font-medium whitespace-nowrap border-b-2 transition-colors">
            プリント穴埋め
          </button>
          <button type="button" id="tab-card" onclick="switchMode('card')" class="pb-1 text-xs sm:text-sm font-medium whitespace-nowrap border-b-2 transition-colors">
            暗記カード
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- =========================================================
       メイン学習エリア（余白を広く取り、英文に集中できる構成）
  ========================================================== -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-8 pb-20">

    <!-- ユニット見出し＆習得状況 -->
    <div class="mb-6 flex flex-col sm:flex-row sm:items-end justify-between gap-2 pb-4 border-b border-soft">
      <div>
        <div class="flex items-center gap-2 text-xs font-medium text-muted mb-1">
          <span id="unit-badge" class="text-accent font-semibold">Unit 9</span>
          <span>/</span>
          <span id="progress-text">習得 0 / 0</span>
        </div>
        <h2 id="unit-title-en" class="text-base sm:text-lg font-bold text-main leading-snug"></h2>
        <p id="unit-title-ja" class="text-xs sm:text-sm text-muted mt-0.5"></p>
      </div>
    </div>

    <!-- =========================================================
         モード1：スラッシュ読解（1文集中 / 一覧 切替対応）
    ========================================================== -->
    <section id="view-slash" class="space-y-5">
      <!-- 静かなコントロールバー -->
      <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
        <div class="flex items-center gap-1.5">
          <!-- 1文集中 / 一覧 切替 -->
          <div class="inline-flex rounded-lg border border-soft p-0.5" style="background-color: var(--bg-surface);">
            <button type="button" id="layout-focus" onclick="setSlashLayout('focus')" class="px-3 py-1.5 rounded-md font-medium transition-colors">
              1文集中
            </button>
            <button type="button" id="layout-list" onclick="setSlashLayout('list')" class="px-3 py-1.5 rounded-md font-medium transition-colors">
              一覧
            </button>
          </div>

          <button
            type="button"
            id="btn-toggle-slashes"
            onclick="toggleSlashes()"
            class="px-3 py-1.5 rounded-lg border border-soft font-medium transition-colors"
            style="background-color: var(--bg-surface);"
          >
            / 区切り: ON
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button
            type="button"
            onclick="setAllChunksVisibility(false)"
            class="px-2.5 py-1.5 rounded-lg text-muted hover:text-main transition-colors font-medium"
          >
            訳を隠す
          </button>
          <button
            type="button"
            onclick="setAllChunksVisibility(true)"
            class="px-2.5 py-1.5 rounded-lg text-muted hover:text-main transition-colors font-medium"
          >
            訳を表示
          </button>
          <label class="inline-flex items-center gap-1.5 text-muted cursor-pointer select-none pl-1">
            <input id="filter-unmastered" type="checkbox" onchange="onFilterUnmasteredChange()" class="w-3.5 h-3.5 rounded accent-orange-600" />
            未習得のみ
          </label>
        </div>
      </div>

      <!-- 1文集中モード用ナビゲーション（上部インジケーター） -->
      <div id="focus-nav-top" class="hidden flex items-center justify-between gap-3 py-1">
        <button
          type="button"
          onclick="stepFocusSentence(-1)"
          id="btn-prev-top"
          class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg border border-soft surface text-xs sm:text-sm font-medium text-muted hover:text-main disabled:opacity-35 transition-colors"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          前の文
        </button>

        <div class="flex items-center gap-2">
          <select
            id="focus-sentence-select"
            onchange="jumpToFocusIndex(Number(this.value))"
            aria-label="文を選択"
            class="rounded-lg border border-soft surface px-3 py-1.5 text-xs sm:text-sm font-medium text-main outline-none"
          ></select>
        </div>

        <button
          type="button"
          onclick="stepFocusSentence(1)"
          id="btn-next-top"
          class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg border border-soft surface text-xs sm:text-sm font-medium text-muted hover:text-main disabled:opacity-35 transition-colors"
        >
          次の文
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <!-- 文カード表示領域（スワイプ対応） -->
      <div id="slash-cards-container" class="space-y-6"></div>

      <!-- 1文集中モード用フッターガイド -->
      <div id="focus-nav-bottom" class="hidden pt-2 flex items-center justify-between gap-3">
        <button
          type="button"
          onclick="stepFocusSentence(-1)"
          id="btn-prev-bottom"
          class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-5 py-3 rounded-xl border border-soft surface text-sm font-medium text-main hover:border-orange-400/60 disabled:opacity-35 transition-colors"
        >
          ← 前の文
        </button>
        <span class="hidden sm:inline text-xs text-faint">
          ← → キーまたはスワイプで移動
        </span>
        <button
          type="button"
          onclick="stepFocusSentence(1)"
          id="btn-next-bottom"
          class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-5 py-3 rounded-xl border text-sm font-medium transition-colors disabled:opacity-35"
          style="background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent);"
        >
          次の文 →
        </button>
      </div>
    </section>

    <!-- =========================================================
         モード2：単語・チャンク演習（静かな4択）
    ========================================================== -->
    <section id="view-quiz" class="hidden space-y-5">
      <div class="surface rounded-2xl border p-5 sm:p-8">
        <!-- モード内サブバー -->
        <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-soft">
          <div class="inline-flex rounded-lg border border-soft p-0.5" style="background-color: var(--bg-subtle);">
            <button type="button" id="quiz-type-vocab" onclick="setQuizType('vocab')" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors">
              重要単語
            </button>
            <button type="button" id="quiz-type-chunk" onclick="setQuizType('chunk')" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors">
              チャンク訳
            </button>
          </div>
          <span id="quiz-score" class="text-xs sm:text-sm font-medium text-muted">正答 0 / 0</span>
        </div>

        <!-- 出題エリア -->
        <div class="py-7 sm:py-8">
          <div class="text-xs font-medium text-muted mb-3" id="quiz-source-tag">Unit 9</div>

          <div class="flex items-start justify-between gap-3 mb-3">
            <h3 id="quiz-question" class="text-xl sm:text-2xl font-bold text-main leading-snug"></h3>
            <button
              type="button"
              onclick="speakCurrentQuiz()"
              title="発音を聞く"
              class="p-2.5 rounded-xl border border-soft subtle-box text-muted hover:text-main transition-colors shrink-0"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/>
              </svg>
            </button>
          </div>

          <p id="quiz-context" class="text-xs sm:text-sm text-muted leading-relaxed mb-7"></p>

          <!-- 4択ボタン -->
          <div id="quiz-options" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>

          <!-- 静かな正誤フィードバック -->
          <div id="quiz-feedback" class="hidden mt-6 p-4 rounded-xl border">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="space-y-1">
                <p id="quiz-feedback-title" class="text-sm font-bold"></p>
                <p id="quiz-feedback-detail" class="text-xs sm:text-sm text-muted leading-relaxed"></p>
              </div>
              <button
                type="button"
                onclick="nextQuizQuestion()"
                class="px-5 py-2.5 rounded-xl border text-sm font-semibold shrink-0 transition-colors"
                style="background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent);"
              >
                次へ →
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- =========================================================
         モード3：プリント穴埋めモード
    ========================================================== -->
    <section id="view-worksheet" class="hidden space-y-5">
      <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
        <span class="text-muted">カッコ部分をタップすると答えが表示されます</span>
        <div class="flex items-center gap-2">
          <button
            type="button"
            onclick="toggleAllWorksheetBlanks(false)"
            class="px-3 py-1.5 rounded-lg border border-soft surface text-muted hover:text-main font-medium transition-colors"
          >
            すべて隠す
          </button>
          <button
            type="button"
            onclick="toggleAllWorksheetBlanks(true)"
            class="px-3 py-1.5 rounded-lg border border-soft surface text-accent font-medium transition-colors"
          >
            すべて表示
          </button>
        </div>
      </div>

      <div id="worksheet-container" class="space-y-4"></div>
    </section>

    <!-- =========================================================
         モード4：暗記カードモード
    ========================================================== -->
    <section id="view-card" class="hidden space-y-5">
      <!-- モード内サブバー -->
      <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
        <div class="flex items-center gap-1.5">
          <div class="inline-flex rounded-lg border border-soft p-0.5" style="background-color: var(--bg-surface);">
            <button type="button" id="card-dir-en2ja" onclick="setCardDirection('en2ja')" class="px-3 py-1.5 rounded-md font-medium transition-colors">
              英→日
            </button>
            <button type="button" id="card-dir-ja2en" onclick="setCardDirection('ja2en')" class="px-3 py-1.5 rounded-md font-medium transition-colors">
              日→英
            </button>
          </div>
          <label class="flex items-center gap-1.5 text-muted cursor-pointer select-none">
            <input id="card-filter-unknown" type="checkbox" onchange="onCardFilterChange()" class="w-3.5 h-3.5 rounded accent-orange-600" checked />
            未習得のみ
          </label>
        </div>
        <div class="flex items-center gap-2">
          <button
            type="button"
            onclick="shuffleCardQueue()"
            class="px-3 py-1.5 rounded-lg border border-soft surface text-muted hover:text-main font-medium transition-colors"
          >
            シャッフル
          </button>
          <button
            type="button"
            onclick="resetCardKnown()"
            class="px-3 py-1.5 rounded-lg border border-soft surface text-muted hover:text-main font-medium transition-colors"
          >
            リセット
          </button>
        </div>
      </div>

      <div id="flashcard-area" class="space-y-4"></div>
    </section>
  </main>

  <!-- 控えめな通知バー（音声エラーなど必要時のみ） -->
  <div
    id="toast"
    class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl border border-soft surface text-xs font-medium text-main shadow-sm opacity-0 pointer-events-none transition-opacity duration-200"
  ></div>

  <script>
    /* =========================================================================
       データ定義：Unit 7・Unit 9（新規追加）・Unit 12
    ========================================================================= */
    const UNITS_DATA = {
      unit7: {
        badge: "Unit 7",
        titleEn: "Gray whales shrinking fast as climate warms",
        titleJa: "気候の温暖化によりコククジラが急速に小型化",
        sentences: [
          {
            id: "u7-1",
            label: "①",
            chunks: [
              { en: "Pacific coast gray whales", ja: "太平洋沿岸のコククジラは" },
              { en: "have shrunk in length", ja: "体長が縮小している" },
              { en: "an astonishing 13 percent", ja: "驚くことに13%も" },
              { en: "since 2000,", ja: "2000年以降、" },
              { en: "adding to evidence", ja: "証拠の追加となっており" },
              { en: "that climate change and other human activities", ja: "気候変動やその他の人間の活動が" },
              { en: "are making marine mammals smaller,", ja: "海洋哺乳類を小型化しているという" },
              { en: "a study says.", ja: "ある研究が発表している。" }
            ],
            jpCloze: "{{太平洋}}沿岸のコククジラは2000年以降、{{体長}}が驚くことに13%も{{縮小}}しており、気候変動やその他の人間の活動が{{海洋哺乳類}}を小型化している{{証拠}}の追加になると、ある研究が発表した。",
            grammarNote: "adding to evidence は分詞構文（「〜という証拠に付け加えて」）。that 節は evidence の内容を説明する同格の that。",
            vocab: [
              { en: "shrink (shrunk)", ja: "縮む、縮小する", pos: "動" },
              { en: "astonishing", ja: "驚くべき", pos: "形" },
              { en: "add to ~", ja: "〜を増やす、〜の追加になる", pos: "熟" },
              { en: "evidence", ja: "証拠", pos: "名" },
              { en: "marine mammals", ja: "海洋哺乳類", pos: "名" }
            ]
          },
          {
            id: "u7-2",

    /* =========================================================================
       アプリの状態管理
    ========================================================================= */
    const STORAGE_KEY_MASTERED = "slash_translation_mastered_v1";
    const STORAGE_KEY_THEME = "slash_translation_theme_v1";
    const STORAGE_KEY_CARD_KNOWN = "flashcard_known_v1";

    let state = {
      currentUnit: "unit9",      // 新規追加した Unit 9 を初期表示
      currentMode: "slash",      // 'slash' | 'quiz' | 'worksheet'
      slashLayout: "focus",      // 'focus'（1文集中） | 'list'（一覧）
      focusIndex: 0,
      theme: "paper",            // 'paper' | 'sepia' | 'dark'
      showSlashes: true,
      speechRate: 0.95,
      masteredIds: new Set(),
      revealedChunks: {},        // key: "u9-1-0" => boolean
      openPanels: {},            // key: "u9-1" => null | 'vocab' | 'draft' | 'answer'
      revealedBlanks: {},        // key: "ws-u9-1-0" => boolean
      userDrafts: {},            // key: "u9-1" => string
      quizType: "vocab",         // 'vocab' | 'chunk'
      quizPool: [],
      currentQuiz: null,
      quizAnswered: false,
      quizCorrect: 0,
      quizTotal: 0,
      cardDirection: "en2ja",    // 'en2ja' | 'ja2en'
      cardOnlyUnknown: true,
      cardQueue: [],
      cardRoundTotal: 0,
      cardFlipped: false,
      cardKnownIds: new Set()
    };

    /* =========================================================================
       保存データの読み込み・保存
    ========================================================================= */
    function loadSavedSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_MASTERED);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) state.masteredIds = new Set(parsed);
        }
        const rawCards = localStorage.getItem(STORAGE_KEY_CARD_KNOWN);
        if (rawCards) {
          const parsedCards = JSON.parse(rawCards);
          if (Array.isArray(parsedCards)) state.cardKnownIds = new Set(parsedCards);
        }
        const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
        if (savedTheme && ["paper", "sepia", "dark"].includes(savedTheme)) {
          state.theme = savedTheme;
        }
      } catch (err) {
        console.warn("Storage unavailable:", err);
      }
      applyTheme();
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY_MASTERED, JSON.stringify([...state.masteredIds]));
      } catch (err) {
        console.warn("Storage save skipped:", err);
      }
    }

    function saveCardKnown() {
      try {
        localStorage.setItem(STORAGE_KEY_CARD_KNOWN, JSON.stringify([...state.cardKnownIds]));
      } catch (err) {
        console.warn("Storage save skipped:", err);
      }
    }

    /* =========================================================================
       テーマ・音声・ユーティリティ
    ========================================================================= */
    function setTheme(themeName) {
      state.theme = themeName;
      applyTheme();
      try {
        localStorage.setItem(STORAGE_KEY_THEME, themeName);
      } catch (err) {
        console.warn("Theme save skipped:", err);
      }
    }

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", state.theme);
      ["paper", "sepia", "dark"].forEach((t) => {
        const btn = document.getElementById(`theme-${t}`);
        if (!btn) return;
        if (state.theme === t) {
          btn.style.backgroundColor = "var(--bg-surface)";
          btn.style.color = "var(--text-main)";
          btn.style.fontWeight = "700";
        } else {
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--text-muted)";
          btn.style.fontWeight = "500";
        }
      });
    }

    let toastTimer = null;
    function showToast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.remove("opacity-0");
      el.classList.add("opacity-100");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add("opacity-0");
        el.classList.remove("opacity-100");
      }, 1800);
    }

    function speakText(text) {
      try {
        if (!("speechSynthesis" in window)) {
          showToast("このブラウザは音声読み上げに非対応です");
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = state.speechRate;
        window.speechSynthesis.speak(utter);
      } catch (err) {
        showToast("音声を再生できませんでした");
      }
    }

    function cycleSpeechRate() {
      const rates = [0.75, 0.95, 1.15];
      const nextIdx = (rates.indexOf(state.speechRate) + 1) % rates.length;
      state.speechRate = rates[nextIdx];
      document.getElementById("btn-rate-cycle").textContent = `速度 ${state.speechRate}x`;
    }

    function stripClozeMarkers(clozeStr) {
      return clozeStr.replace(/\{\{(.*?)\}\}/g, "$1");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeJsSingle(str) {
      return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    /* =========================================================================
       ユニット・モード・レイアウト切替
    ========================================================================= */
    function switchUnit(unitKey) {
      state.currentUnit = unitKey;
      state.focusIndex = 0;
      updateHeaderUI();
      renderCurrentView();
      if (state.currentMode === "quiz") resetQuizPoolAndNext();
      if (state.currentMode === "card") { buildCardQueue(); renderCardMode(); }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function switchMode(mode) {
      state.currentMode = mode;
      updateHeaderUI();
      renderCurrentView();
      if (mode === "quiz") resetQuizPoolAndNext();
      if (mode === "card") { buildCardQueue(); renderCardMode(); }
    }

    function setSlashLayout(layout) {
      state.slashLayout = layout;
      renderSlashMode();
    }

    function onFilterUnmasteredChange() {
      state.focusIndex = 0;
      renderSlashMode();
    }

    function updateHeaderUI() {
      const unit = UNITS_DATA[state.currentUnit];

      // ユニットタブ（落ち着いた控えめな選択表示）
      ["unit7", "unit9", "unit12"].forEach((key) => {
        const idMap = { unit7: "btn-unit-7", unit9: "btn-unit-9", unit12: "btn-unit-12" };
        const btn = document.getElementById(idMap[key]);
        if (!btn) return;
        if (state.currentUnit === key) {
          btn.style.backgroundColor = "var(--accent-soft)";
          btn.style.color = "var(--accent)";
          btn.style.fontWeight = "700";
        } else {
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--text-muted)";
          btn.style.fontWeight = "500";
        }
      });

      // モードタブ（下線のみでシンプルに）
      ["slash", "quiz", "worksheet", "card"].forEach((t) => {
        const el = document.getElementById(`tab-${t}`);
        if (!el) return;
        if (state.currentMode === t) {
          el.style.borderColor = "var(--accent)";
          el.style.color = "var(--text-main)";
          el.style.fontWeight = "700";
        } else {
          el.style.borderColor = "transparent";
          el.style.color = "var(--text-muted)";
          el.style.fontWeight = "500";
        }
      });

      if (state.currentMode === "card") {
        document.getElementById("unit-badge").textContent = `${unit.badge}（全${FLASHCARD_DATA[state.currentUnit].length}語）`;
      } else {
        document.getElementById("unit-badge").textContent = `${unit.badge}（全${unit.sentences.length}文）`;
      }
      document.getElementById("unit-title-en").textContent = unit.titleEn;
      document.getElementById("unit-title-ja").textContent = unit.titleJa;

      updateProgressUI();
    }

    function updateProgressUI() {
      const unit = UNITS_DATA[state.currentUnit];
      if (state.currentMode === "card") {
        const cards = FLASHCARD_DATA[state.currentUnit];
        const known = cards.filter((_, i) => state.cardKnownIds.has(`fc-${state.currentUnit}-${i}`)).length;
        const pct = cards.length === 0 ? 0 : Math.round((known / cards.length) * 100);
        document.getElementById("top-progress-line").style.width = `${pct}%`;
        document.getElementById("progress-text").textContent = `覚えた ${known} / ${cards.length}`;
        return;
      }
      const total = unit.sentences.length;
      const done = unit.sentences.filter((s) => state.masteredIds.has(s.id)).length;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById("top-progress-line").style.width = `${pct}%`;
      document.getElementById("progress-text").textContent = `習得 ${done} / ${total}`;
    }

    function renderCurrentView() {
      document.getElementById("view-slash").classList.toggle("hidden", state.currentMode !== "slash");
      document.getElementById("view-quiz").classList.toggle("hidden", state.currentMode !== "quiz");
      document.getElementById("view-worksheet").classList.toggle("hidden", state.currentMode !== "worksheet");
      document.getElementById("view-card").classList.toggle("hidden", state.currentMode !== "card");

      if (state.currentMode === "slash") renderSlashMode();
      if (state.currentMode === "worksheet") renderWorksheetMode();
      if (state.currentMode === "card") renderCardMode();
    }

    /* =========================================================================
       モード1：スラッシュ読解（1文集中 & 一覧）
    ========================================================================= */
    function getFilteredSentences() {
      const unit = UNITS_DATA[state.currentUnit];
      const onlyUnmastered = document.getElementById("filter-unmastered").checked;
      return unit.sentences.filter((s) => !onlyUnmastered || !state.masteredIds.has(s.id));
    }

    function stepFocusSentence(delta) {
      const list = getFilteredSentences();
      if (list.length === 0) return;
      const next = state.focusIndex + delta;
      if (next >= 0 && next < list.length) {
        state.focusIndex = next;
        renderSlashMode();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function jumpToFocusIndex(index) {
      const list = getFilteredSentences();
      if (index >= 0 && index < list.length) {
        state.focusIndex = index;
        renderSlashMode();
      }
    }

    function toggleSlashes() {
      state.showSlashes = !state.showSlashes;
      const btn = document.getElementById("btn-toggle-slashes");
      btn.textContent = state.showSlashes ? "/ 区切り: ON" : "/ 区切り: OFF";
      btn.style.color = state.showSlashes ? "var(--accent)" : "var(--text-muted)";
      renderSlashMode();
    }

    function setAllChunksVisibility(show) {
      const list = getFilteredSentences();
      const targets = state.slashLayout === "focus" && list[state.focusIndex]
        ? [list[state.focusIndex]]
        : list;

      targets.forEach((sent) => {
        sent.chunks.forEach((_, idx) => {
          state.revealedChunks[`${sent.id}-${idx}`] = show;
        });
      });
      renderSlashMode();
    }

    function toggleChunk(sentId, chunkIdx) {
      const key = `${sentId}-${chunkIdx}`;
      state.revealedChunks[key] = !state.revealedChunks[key];

      const jaEl = document.getElementById(`chunk-ja-${key}`);
      const boxEl = document.getElementById(`chunk-box-${key}`);
      if (jaEl && boxEl) {
        const revealed = state.revealedChunks[key];
        jaEl.className = `mt-2 text-xs sm:text-sm font-medium leading-snug ${revealed ? "chunk-visible" : "chunk-hidden"}`;
        boxEl.style.borderColor = revealed ? "var(--accent-border)" : "var(--border-soft)";
        boxEl.style.backgroundColor = revealed ? "var(--accent-soft)" : "var(--bg-surface)";
      }
    }

    function toggleSentenceChunks(sentId, show) {
      const unit = UNITS_DATA[state.currentUnit];
      const sent = unit.sentences.find((s) => s.id === sentId);
      if (!sent) return;
      sent.chunks.forEach((_, idx) => {
        const key = `${sentId}-${idx}`;
        state.revealedChunks[key] = show;
        const jaEl = document.getElementById(`chunk-ja-${key}`);
        const boxEl = document.getElementById(`chunk-box-${key}`);
        if (jaEl && boxEl) {
          jaEl.className = `mt-2 text-xs sm:text-sm font-medium leading-snug ${show ? "chunk-visible" : "chunk-hidden"}`;
          boxEl.style.borderColor = show ? "var(--accent-border)" : "var(--border-soft)";
          boxEl.style.backgroundColor = show ? "var(--accent-soft)" : "var(--bg-surface)";
        }
      });
    }

    // 補助パネル（重要単語 / 和訳メモ / 模範和訳）を1つずつ静かに開閉
    function togglePanel(sentId, panelName) {
      state.openPanels[sentId] = state.openPanels[sentId] === panelName ? null : panelName;
      renderSlashMode();
    }

    function toggleMastered(sentId) {
      if (state.masteredIds.has(sentId)) {
        state.masteredIds.delete(sentId);
      } else {
        state.masteredIds.add(sentId);
      }
      saveProgress();
      updateProgressUI();
      renderSlashMode();
    }

    function saveDraft(sentId, value) {
      state.userDrafts[sentId] = value;
    }

    function flipVocabChip(chipEl, enText, jaText) {
      const isFlipped = chipEl.dataset.flipped === "true";
      const labelEl = chipEl.querySelector(".vocab-text");
      if (isFlipped) {
        chipEl.dataset.flipped = "false";
        labelEl.textContent = enText;
        chipEl.style.borderColor = "var(--border-soft)";
        chipEl.style.backgroundColor = "var(--bg-surface)";
        chipEl.style.color = "var(--text-main)";
      } else {
        chipEl.dataset.flipped = "true";
        labelEl.textContent = jaText;
        chipEl.style.borderColor = "var(--accent-border)";
        chipEl.style.backgroundColor = "var(--accent-soft)";
        chipEl.style.color = "var(--accent)";
      }
    }

    function buildSentenceCardHtml(sent) {
      const isMastered = state.masteredIds.has(sent.id);
      const fullEn = sent.chunks.map((c) => c.en).join(" ");
      const fullJp = stripClozeMarkers(sent.jpCloze);
      const activePanel = state.openPanels[sent.id] || null;
      const draftVal = state.userDrafts[sent.id] || "";

      // 1) オレンジスラッシュ付き英文（読みやすさ最優先の行間・文字サイズ）
      const slashLineHtml = sent.chunks.map((chunk, i) => {
        const isLast = i === sent.chunks.length - 1;
        const slashSpan = state.showSlashes && !isLast
          ? `<span class="text-accent font-semibold mx-1.5 select-none">/</span>`
          : " ";
        return `<span class="cursor-pointer hover:underline decoration-orange-400/70 underline-offset-4" onclick="toggleChunk('${sent.id}', ${i})" title="タップしてこのチャンクの訳を表示">${escapeHtml(chunk.en)}</span>${slashSpan}`;
      }).join("");

      // 2) チャンク分解ブロック
      const chunkCardsHtml = sent.chunks.map((chunk, idx) => {
        const key = `${sent.id}-${idx}`;
        const revealed = !!state.revealedChunks[key];
        return `
          <button
            type="button"
            id="chunk-box-${key}"
            onclick="toggleChunk('${sent.id}', ${idx})"
            class="flex flex-col justify-between p-3 rounded-xl border text-left transition-colors"
            style="border-color: ${revealed ? 'var(--accent-border)' : 'var(--border-soft)'}; background-color: ${revealed ? 'var(--accent-soft)' : 'var(--bg-surface)'};"
          >
            <div class="flex items-start justify-between gap-2 w-full">
              <span class="text-sm sm:text-[15px] font-medium text-main leading-snug">${escapeHtml(chunk.en)}</span>
              <span
                onclick="event.stopPropagation(); speakText('${escapeJsSingle(chunk.en)}')"
                title="この部分を聞く"
                class="p-1 -m-1 text-faint hover:text-accent shrink-0 transition-colors"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07"/>
                </svg>
              </span>
            </div>
            <div id="chunk-ja-${key}" class="mt-2 text-xs sm:text-sm font-medium leading-snug ${revealed ? 'chunk-visible' : 'chunk-hidden'}">
              ${escapeHtml(chunk.ja)}
            </div>
          </button>
        `;
      }).join("");

      // 3) 補助パネル内容（必要なときだけ開くので気が散らない）
      let panelBodyHtml = "";
      if (activePanel === "vocab") {
        const vocabHtml = sent.vocab.map((v) => `
          <button
            type="button"
            data-flipped="false"
            onclick="flipVocabChip(this, '${escapeJsSingle(v.en)}', '${escapeJsSingle(v.ja)}')"
            class="inline-flex items-center gap-2 px-3 py-2 rounded-xl border text-xs sm:text-sm font-medium transition-colors select-none"
            style="border-color: var(--border-soft); background-color: var(--bg-surface); color: var(--text-main);"
          >
            <span class="text-[10px] text-faint font-semibold">${escapeHtml(v.pos)}</span>
            <span class="vocab-text">${escapeHtml(v.en)}</span>
          </button>
        `).join("");
        panelBodyHtml = `
          <div class="mt-4 pt-4 border-t border-soft">
            <p class="text-[11px] text-faint mb-2.5">タップで日本語の意味を確認</p>
            <div class="flex flex-wrap gap-2">${vocabHtml}</div>
          </div>
        `;
      } else if (activePanel === "draft") {
        panelBodyHtml = `
          <div class="mt-4 pt-4 border-t border-soft">
            <textarea
              rows="3"
              oninput="saveDraft('${sent.id}', this.value)"
              placeholder="チャンクをつなげて、自分の言葉で日本語にしてみましょう..."
              class="w-full rounded-xl border border-soft subtle-box px-3.5 py-2.5 text-sm text-main outline-none focus:border-orange-400 transition-colors"
            >${escapeHtml(draftVal)}</textarea>
          </div>
        `;
      } else if (activePanel === "answer") {
        panelBodyHtml = `
          <div class="mt-4 pt-4 border-t border-soft space-y-3">
            <div>
              <span class="text-[11px] font-semibold text-accent">模範和訳</span>
              <p class="mt-1 text-sm sm:text-base font-medium text-main leading-relaxed">${escapeHtml(fullJp)}</p>
            </div>
            <div class="p-3.5 rounded-xl subtle-box border border-soft">
              <span class="text-[11px] font-semibold text-muted">構文・ポイント</span>
              <p class="mt-1 text-xs sm:text-sm text-muted leading-relaxed">${escapeHtml(sent.grammarNote)}</p>
            </div>
          </div>
        `;
      }

      const tabBtnStyle = (name) => activePanel === name
        ? `background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); font-weight: 600;`
        : `background-color: transparent; border-color: var(--border-soft); color: var(--text-muted); font-weight: 500;`;

      return `
        <article class="surface rounded-2xl border p-5 sm:p-7 space-y-6">
          <!-- 文ヘッダー（最小限の操作のみ） -->
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5">
              <span class="text-xs font-bold text-accent px-2 py-0.5 rounded-md" style="background-color: var(--accent-soft);">
                ${escapeHtml(sent.label)}
              </span>
              <button
                type="button"
                onclick="speakText('${escapeJsSingle(fullEn)}')"
                class="inline-flex items-center gap-1.5 text-xs font-medium text-muted hover:text-main transition-colors px-2 py-1 rounded-lg"
                title="英文を読み上げる"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07"/>
                </svg>
                音声
              </button>
              <button
                type="button"
                onclick="toggleSentenceChunks('${sent.id}', true)"
                class="text-xs font-medium text-faint hover:text-main transition-colors px-1.5 py-1"
              >
                全開
              </button>
              <button
                type="button"
                onclick="toggleSentenceChunks('${sent.id}', false)"
                class="text-xs font-medium text-faint hover:text-main transition-colors px-1.5 py-1"
              >
                隠す
              </button>
            </div>

            <button
              type="button"
              onclick="toggleMastered('${sent.id}')"
              class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs font-medium transition-colors"
              style="border-color: ${isMastered ? 'var(--done)' : 'var(--border-soft)'}; background-color: ${isMastered ? 'var(--done-soft)' : 'transparent'}; color: ${isMastered ? 'var(--done)' : 'var(--text-muted)'};"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
              ${isMastered ? "習得済み" : "習得チェック"}
            </button>
          </div>

          <!-- 英文本体（視覚的な主役） -->
          <div class="text-lg sm:text-[21px] font-medium text-main leading-[1.95] tracking-[0.01em]">
            ${slashLineHtml}
          </div>

          <!-- チャンク練習グリッド -->
          <div class="pt-2">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${chunkCardsHtml}
            </div>
          </div>

          <!-- 補助ツール（折りたたみタブでノイズを排除） -->
          <div class="pt-3 border-t border-soft">
            <div class="flex flex-wrap items-center gap-2">
              <button
                type="button"
                onclick="togglePanel('${sent.id}', 'vocab')"
                class="px-3 py-1.5 rounded-lg border text-xs transition-colors"
                style="${tabBtnStyle('vocab')}"
              >
                重要単語 (${sent.vocab.length})
              </button>
              <button
                type="button"
                onclick="togglePanel('${sent.id}', 'draft')"
                class="px-3 py-1.5 rounded-lg border text-xs transition-colors"
                style="${tabBtnStyle('draft')}"
              >
                和訳メモ${draftVal.trim() ? "・記入あり" : ""}
              </button>
              <button
                type="button"
                onclick="togglePanel('${sent.id}', 'answer')"
                class="px-3 py-1.5 rounded-lg border text-xs transition-colors"
                style="${tabBtnStyle('answer')}"
              >
                模範和訳・解説
              </button>
            </div>
            ${panelBodyHtml}
          </div>
        </article>
      `;
    }

    function renderSlashMode() {
      const container = document.getElementById("slash-cards-container");
      const list = getFilteredSentences();

      // レイアウトボタンの見た目更新
      ["focus", "list"].forEach((mode) => {
        const btn = document.getElementById(`layout-${mode}`);
        if (state.slashLayout === mode) {
          btn.style.backgroundColor = "var(--accent-soft)";
          btn.style.color = "var(--accent)";
          btn.style.fontWeight = "700";
        } else {
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--text-muted)";
          btn.style.fontWeight = "500";
        }
      });

      const slashBtn = document.getElementById("btn-toggle-slashes");
      slashBtn.style.color = state.showSlashes ? "var(--accent)" : "var(--text-muted)";

      const navTop = document.getElementById("focus-nav-top");
      const navBottom = document.getElementById("focus-nav-bottom");

      if (list.length === 0) {
        navTop.classList.add("hidden");
        navBottom.classList.add("hidden");
        container.innerHTML = `
          <div class="surface rounded-2xl border p-10 text-center space-y-2">
            <p class="text-base font-bold text-main">このユニットの未習得の文はありません</p>
            <p class="text-xs sm:text-sm text-muted">「未習得のみ」を外すか、演習モードで復習できます。</p>
          </div>
        `;
        return;
      }

      if (state.slashLayout === "focus") {
        if (state.focusIndex >= list.length) state.focusIndex = list.length - 1;
        if (state.focusIndex < 0) state.focusIndex = 0;

        navTop.classList.remove("hidden");
        navBottom.classList.remove("hidden");

        // セレクトボックス更新
        const selectEl = document.getElementById("focus-sentence-select");
        selectEl.innerHTML = list.map((s, idx) =>
          `<option value="${idx}" ${idx === state.focusIndex ? "selected" : ""}>${escapeHtml(s.label)} （${idx + 1} / ${list.length}）</option>`
        ).join("");

        const isFirst = state.focusIndex === 0;
        const isLast = state.focusIndex === list.length - 1;
        document.getElementById("btn-prev-top").disabled = isFirst;
        document.getElementById("btn-prev-bottom").disabled = isFirst;
        document.getElementById("btn-next-top").disabled = isLast;
        document.getElementById("btn-next-bottom").disabled = isLast;

        container.innerHTML = buildSentenceCardHtml(list[state.focusIndex]);
      } else {
        navTop.classList.add("hidden");
        navBottom.classList.add("hidden");
        container.innerHTML = list.map((sent) => buildSentenceCardHtml(sent)).join("");
      }
    }

    /* =========================================================================
       モード2：単語・チャンク演習（静かな4択）
    ========================================================================= */
    function setQuizType(type) {
      state.quizType = type;
      state.quizCorrect = 0;
      state.quizTotal = 0;
      resetQuizPoolAndNext();
    }

    function updateQuizTypeButtons() {
      ["vocab", "chunk"].forEach((t) => {
        const btn = document.getElementById(`quiz-type-${t}`);
        if (state.quizType === t) {
          btn.style.backgroundColor = "var(--bg-surface)";
          btn.style.color = "var(--text-main)";
          btn.style.fontWeight = "700";
        } else {
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--text-muted)";
          btn.style.fontWeight = "500";
        }
      });
      document.getElementById("quiz-score").textContent = `正答 ${state.quizCorrect} / ${state.quizTotal}`;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildQuizPool() {
      const unit = UNITS_DATA[state.currentUnit];
      const items = [];
      unit.sentences.forEach((sent) => {
        const fullEn = sent.chunks.map((c) => c.en).join(" ");
        if (state.quizType === "vocab") {
          sent.vocab.forEach((v) => {
            items.push({
              en: v.en,
              ja: v.ja,
              tag: `${unit.badge} / 文 ${sent.label}（${v.pos}）`,
              context: fullEn,
              fullJp: stripClozeMarkers(sent.jpCloze)
            });
          });
        } else {
          sent.chunks.forEach((c) => {
            items.push({
              en: c.en,
              ja: c.ja,
              tag: `${unit.badge} / 文 ${sent.label}`,
              context: fullEn,
              fullJp: stripClozeMarkers(sent.jpCloze)
            });
          });
        }
      });
      return items;
    }

    function resetQuizPoolAndNext() {
      updateQuizTypeButtons();
      state.quizPool = shuffleArray(buildQuizPool());
      nextQuizQuestion();
    }

    function nextQuizQuestion() {
      const allItems = buildQuizPool();
      if (state.quizPool.length === 0) {
        state.quizPool = shuffleArray(allItems);
      }

      const target = state.quizPool.pop();
      const distractors = shuffleArray(
        allItems.filter((item) => item.ja !== target.ja && item.en !== target.en)
      ).slice(0, 3);

      const options = shuffleArray([target, ...distractors]);
      state.currentQuiz = { target, options };
      state.quizAnswered = false;

      document.getElementById("quiz-source-tag").textContent = target.tag;
      document.getElementById("quiz-question").textContent = target.en;
      document.getElementById("quiz-context").textContent = target.context;
      document.getElementById("quiz-feedback").classList.add("hidden");

      const optionsContainer = document.getElementById("quiz-options");
      optionsContainer.innerHTML = options.map((opt, idx) => `
        <button
          type="button"
          id="quiz-opt-${idx}"
          onclick="answerQuiz(${idx})"
          class="p-4 rounded-xl border border-soft surface hover:border-orange-400/70 text-sm sm:text-base font-medium text-main transition-colors text-left leading-snug"
        >
          <span class="inline-block w-5 text-xs font-semibold text-faint mr-1">${idx + 1}.</span>
          ${escapeHtml(opt.ja)}
        </button>
      `).join("");

      updateQuizTypeButtons();
    }

    function answerQuiz(chosenIdx) {
      if (state.quizAnswered || !state.currentQuiz) return;
      state.quizAnswered = true;
      state.quizTotal += 1;

      const { target, options } = state.currentQuiz;
      const isCorrect = options[chosenIdx].ja === target.ja;
      if (isCorrect) state.quizCorrect += 1;

      options.forEach((opt, idx) => {
        const btn = document.getElementById(`quiz-opt-${idx}`);
        btn.disabled = true;
        if (opt.ja === target.ja) {
          btn.style.borderColor = "var(--done)";
          btn.style.backgroundColor = "var(--done-soft)";
          btn.style.color = "var(--done)";
          btn.style.fontWeight = "700";
        } else if (idx === chosenIdx) {
          btn.style.borderColor = "var(--wrong)";
          btn.style.backgroundColor = "var(--wrong-soft)";
          btn.style.color = "var(--wrong)";
        } else {
          btn.style.opacity = "0.45";
        }
      });

      const fb = document.getElementById("quiz-feedback");
      const fbTitle = document.getElementById("quiz-feedback-title");
      const fbDetail = document.getElementById("quiz-feedback-detail");

      fb.classList.remove("hidden");
      fb.style.borderColor = isCorrect ? "var(--done)" : "var(--wrong)";
      fb.style.backgroundColor = isCorrect ? "var(--done-soft)" : "var(--wrong-soft)";
      fbTitle.style.color = isCorrect ? "var(--done)" : "var(--wrong)";
      fbTitle.textContent = isCorrect ? "正解" : `不正解 — 正答：${target.ja}`;
      fbDetail.textContent = target.fullJp;
      updateQuizTypeButtons();
    }

    function speakCurrentQuiz() {
      if (state.currentQuiz) speakText(state.currentQuiz.target.en);
    }

    /* =========================================================================
       モード3：プリント穴埋めモード
    ========================================================================= */
    function toggleWorksheetBlank(blankKey) {
      state.revealedBlanks[blankKey] = !state.revealedBlanks[blankKey];
      const el = document.getElementById(`blank-${blankKey}`);
      if (el) {
        const open = state.revealedBlanks[blankKey];
        el.textContent = open ? el.dataset.answer : "　　　";
        el.className = `cloze-slot ${open ? "cloze-slot-open" : "cloze-slot-closed"}`;
      }
    }

    function toggleAllWorksheetBlanks(show) {
      const unit = UNITS_DATA[state.currentUnit];
      unit.sentences.forEach((sent) => {
        let count = 0;
        sent.jpCloze.replace(/\{\{(.*?)\}\}/g, () => {
          state.revealedBlanks[`ws-${sent.id}-${count}`] = show;
          count++;
        });
      });
      renderWorksheetMode();
    }

    function renderWorksheetMode() {
      const container = document.getElementById("worksheet-container");
      const unit = UNITS_DATA[state.currentUnit];

      container.innerHTML = unit.sentences.map((sent) => {
        const fullEn = sent.chunks.map((c) => c.en).join(" ");
        const slashEn = sent.chunks
          .map((c) => escapeHtml(c.en))
          .join(`<span class="text-accent font-semibold mx-1.5">/</span>`);

        let blankIdx = 0;
        const clozeHtml = escapeHtml(sent.jpCloze).replace(/\{\{(.*?)\}\}/g, (_, word) => {
          const key = `ws-${sent.id}-${blankIdx++}`;
          const open = !!state.revealedBlanks[key];
          return `<button
            type="button"
            id="blank-${key}"
            data-answer="${word}"
            onclick="toggleWorksheetBlank('${key}')"
            class="cloze-slot ${open ? 'cloze-slot-open' : 'cloze-slot-closed'}"
          >${open ? word : '　　　'}</button>`;
        });

        return `
          <div class="surface rounded-2xl border p-5 sm:p-6 space-y-4">
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-start gap-3">
                <span class="text-xs font-bold text-accent mt-1 shrink-0">${escapeHtml(sent.label)}</span>
                <p class="text-sm sm:text-base font-medium text-main leading-relaxed">${slashEn}</p>
              </div>
              <button
                type="button"
                onclick="speakText('${escapeJsSingle(fullEn)}')"
                class="p-1.5 text-faint hover:text-main transition-colors shrink-0"
                title="英文を読み上げる"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07"/>
                </svg>
              </button>
            </div>

            <div class="pt-3 border-t border-soft text-sm sm:text-[15px] text-main leading-[2.2]">
              ${clozeHtml}
            </div>
          </div>
        `;
      }).join("");
    }

    /* =========================================================================
       モード4：暗記カードモード
    ========================================================================= */
    function buildCardQueue(options = {}) {
      const cards = FLASHCARD_DATA[state.currentUnit];
      let ids = cards.map((_, i) => `fc-${state.currentUnit}-${i}`);
      const onlyUnknown = options.ignoreFilter ? false : state.cardOnlyUnknown;
      if (onlyUnknown) ids = ids.filter((id) => !state.cardKnownIds.has(id));
      if (options.shuffle) ids = shuffleArray(ids);
      state.cardQueue = ids;
      state.cardRoundTotal = ids.length;
      state.cardFlipped = false;
    }

    function setCardDirection(dir) {
      state.cardDirection = dir;
      state.cardFlipped = false;
      renderCardMode();
    }

    function updateCardSubBar() {
      ["en2ja", "ja2en"].forEach((dir) => {
        const btn = document.getElementById(`card-dir-${dir}`);
        if (!btn) return;
        if (state.cardDirection === dir) {
          btn.style.backgroundColor = "var(--accent-soft)";
          btn.style.color = "var(--accent)";
          btn.style.fontWeight = "700";
        } else {
          btn.style.backgroundColor = "transparent";
          btn.style.color = "var(--text-muted)";
          btn.style.fontWeight = "500";
        }
      });
      const filterEl = document.getElementById("card-filter-unknown");
      if (filterEl) filterEl.checked = state.cardOnlyUnknown;
    }

    function onCardFilterChange() {
      state.cardOnlyUnknown = document.getElementById("card-filter-unknown").checked;
      buildCardQueue();
      renderCardMode();
    }

    function shuffleCardQueue() {
      buildCardQueue({ shuffle: true });
      renderCardMode();
    }

    function resetCardKnown() {
      if (!confirm("このユニットの「覚えた」記録をリセットしますか？")) return;
      const prefix = `fc-${state.currentUnit}-`;
      [...state.cardKnownIds].forEach((id) => {
        if (id.startsWith(prefix)) state.cardKnownIds.delete(id);
      });
      saveCardKnown();
      buildCardQueue();
      renderCardMode();
      updateProgressUI();
    }

    function cardReplayAll() {
      buildCardQueue({ ignoreFilter: true });
      renderCardMode();
    }

    function cardShuffleRestart() {
      buildCardQueue({ ignoreFilter: true, shuffle: true });
      renderCardMode();
    }

    function flipCard() {
      if (state.cardQueue.length === 0 || state.cardFlipped) return;
      state.cardFlipped = true;
      renderCardMode();
    }

    function answerCard(known) {
      if (!state.cardFlipped || state.cardQueue.length === 0) return;
      const id = state.cardQueue.shift();
      if (known) {
        state.cardKnownIds.add(id);
      } else {
        state.cardKnownIds.delete(id);
        const pos = Math.min(3, state.cardQueue.length);
        state.cardQueue.splice(pos, 0, id);
      }
      saveCardKnown();
      state.cardFlipped = false;
      renderCardMode();
      updateProgressUI();
    }

    function renderCardMode() {
      const area = document.getElementById("flashcard-area");
      if (!area) return;
      updateCardSubBar();
      const unit = UNITS_DATA[state.currentUnit];
      const cards = FLASHCARD_DATA[state.currentUnit];

      if (state.cardQueue.length === 0) {
        const known = cards.filter((_, i) => state.cardKnownIds.has(`fc-${state.currentUnit}-${i}`)).length;
        area.innerHTML = `
          <div class="surface rounded-2xl border p-7 sm:p-10 text-center space-y-4">
            <p class="text-base sm:text-lg font-bold text-main">このユニットのカードをすべて確認しました</p>
            <p class="text-xs sm:text-sm text-muted">覚えた ${known} / ${cards.length} 語</p>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-2.5 pt-2">
              <button
                type="button"
                onclick="cardReplayAll()"
                class="px-5 py-2.5 rounded-xl border text-sm font-semibold transition-colors"
                style="background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent);"
              >
                もう一度（全カード）
              </button>
              <button
                type="button"
                onclick="cardShuffleRestart()"
                class="px-5 py-2.5 rounded-xl border text-sm font-semibold transition-colors"
                style="background-color: var(--accent-soft); border-color: var(--accent-border); color: var(--accent);"
              >
                シャッフルして再開
              </button>
            </div>
          </div>
        `;
        return;
      }

      const id = state.cardQueue[0];
      const idx = Number(id.split("-").pop());
      const [en, ja] = cards[idx];
      const front = state.cardDirection === "en2ja" ? en : ja;
      const back = state.cardDirection === "en2ja" ? ja : en;
      const pos = Math.min(state.cardRoundTotal - state.cardQueue.length + 1, state.cardRoundTotal);

      area.innerHTML = `
        <div
          id="flashcard"
          onclick="flipCard()"
          class="surface rounded-2xl border p-7 sm:p-10 cursor-pointer select-none"
          style="min-height: 14rem;"
          role="button"
          aria-label="カードをめくる"
        >
          <div class="flex items-center justify-between gap-3 text-xs font-medium text-muted mb-5">
            <span class="text-accent font-semibold">${escapeHtml(unit.badge)}</span>
            <span>${pos} / ${state.cardRoundTotal}</span>
          </div>
          <div class="flex items-start justify-between gap-3">
            <h3 class="text-2xl sm:text-3xl font-bold text-main leading-snug text-center flex-1">${escapeHtml(front)}</h3>
            <button
              type="button"
              onclick="event.stopPropagation(); speakText('${escapeJsSingle(en)}')"
              title="英語を読み上げる"
              class="p-2.5 rounded-xl border border-soft subtle-box text-muted hover:text-main transition-colors shrink-0"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/>
              </svg>
            </button>
          </div>
          ${state.cardFlipped ? `
          <div class="mt-6 pt-5 border-t border-soft text-center">
            <p class="text-lg sm:text-xl font-bold leading-relaxed" style="color: var(--accent);">${escapeHtml(back)}</p>
          </div>
          ` : `
          <p class="mt-6 pt-5 border-t border-soft text-center text-xs text-faint">タップして答えを表示</p>
          `}
        </div>

        <div class="flex items-center justify-center gap-3">
          <button
            type="button"
            id="card-btn-wrong"
            onclick="answerCard(false)"
            ${state.cardFlipped ? "" : "disabled"}
            class="px-6 py-2.5 rounded-xl border text-sm font-semibold transition-colors ${state.cardFlipped ? "" : "opacity-40"}"
            style="background-color: var(--wrong-soft); border-color: var(--wrong); color: var(--wrong);"
          >
            まだ <span class="text-[10px] font-normal opacity-70 ml-1">←</span>
          </button>
          <button
            type="button"
            id="card-btn-known"
            onclick="answerCard(true)"
            ${state.cardFlipped ? "" : "disabled"}
            class="px-6 py-2.5 rounded-xl border text-sm font-semibold transition-colors ${state.cardFlipped ? "" : "opacity-40"}"
            style="background-color: var(--done-soft); border-color: var(--done); color: var(--done);"
          >
            覚えた <span class="text-[10px] font-normal opacity-70 ml-1">→</span>
          </button>
        </div>
      `;
    }

    /* =========================================================================
       キーボード操作＆タッチスワイプ（集中モードでの快適な移動）
    ========================================================================= */
    function initNavigationShortcuts() {
      document.addEventListener("keydown", (e) => {
        const tag = document.activeElement?.tagName;
        if (tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT") return;

        if (state.currentMode === "slash" && state.slashLayout === "focus") {
          if (e.key === "ArrowLeft") stepFocusSentence(-1);
          if (e.key === "ArrowRight") stepFocusSentence(1);
        } else if (state.currentMode === "quiz") {
          if (["1", "2", "3", "4"].includes(e.key) && !state.quizAnswered) {
            answerQuiz(Number(e.key) - 1);
          } else if (e.key === "Enter" && state.quizAnswered) {
            nextQuizQuestion();
          }
        } else if (state.currentMode === "card") {
          if (!state.cardFlipped) {
            if (e.key === " " || e.key === "Enter") {
              e.preventDefault();
              flipCard();
            }
          } else {
            if (e.key === "ArrowLeft" || e.key === "1") answerCard(false);
            if (e.key === "ArrowRight" || e.key === "2") answerCard(true);
            if (e.key === " ") e.preventDefault();
          }
        }
      });

      // スワイプ移動（タッチデバイス対応）
      const cardArea = document.getElementById("slash-cards-container");
      let startX = 0;
      let startY = 0;
      cardArea.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      cardArea.addEventListener("touchend", (e) => {
        if (state.currentMode !== "slash" || state.slashLayout !== "focus") return;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          stepFocusSentence(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      // カードのスワイプ判定（めくった後のみ有効）
      const flashArea = document.getElementById("flashcard-area");
      let cardStartX = 0;
      let cardStartY = 0;
      flashArea.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) return;
        cardStartX = e.touches[0].clientX;
        cardStartY = e.touches[0].clientY;
      }, { passive: true });

      flashArea.addEventListener("touchend", (e) => {
        if (state.currentMode !== "card" || !state.cardFlipped) return;
        const dx = e.changedTouches[0].clientX - cardStartX;
        const dy = e.changedTouches[0].clientY - cardStartY;
        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          answerCard(dx < 0 ? false : true);
        }
      }, { passive: true });
    }

    /* =========================================================================
       アプリ起動
    ========================================================================= */
    window.addEventListener("DOMContentLoaded", () => {
      loadSavedSettings();
      initNavigationShortcuts();
      updateHeaderUI();
      renderCurrentView();
    });
  </script>
</body>
</html>
